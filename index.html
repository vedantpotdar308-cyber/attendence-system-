<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>वेदांत एंटरप्रायझेस | Attendance, Overtime & Payroll System</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#1e3a8a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<!-- Firebase Cloud SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="sync.js"></script>

<style>
/* ============================================================
   PREMIUM ENTERPRISE DESIGN SYSTEM
   ============================================================ */
:root {
  --font-main: 'Plus Jakarta Sans', 'Noto Sans Devanagari', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  
  --primary: #1e3a8a;          /* Deep Royal Indigo */
  --primary-hover: #172554;
  --primary-light: #2563eb;
  --primary-soft: #eff6ff;
  --primary-border: #bfdbfe;

  --accent-ot: #ea580c;         /* Overtime Orange */
  --accent-ot-hover: #c2410c;
  --accent-ot-soft: #fff7ed;
  --accent-ot-border: #fdba74;

  --success: #059669;
  --success-soft: #ecfdf5;
  --danger: #dc2626;
  --danger-soft: #fef2f2;
  --warning: #d97706;
  --warning-soft: #fffbeb;
  --info: #0284c7;
  --info-soft: #f0f9ff;
  --purple: #7c3aed;
  --purple-soft: #f5f3ff;

  --ink-900: #0f172a;          /* Deep slate */
  --ink-700: #334155;          /* Normal body */
  --ink-500: #64748b;          /* Muted labels */
  --ink-300: #94a3b8;          /* Light borders/placeholders */
  --bg-page: #f8fafc;          /* Off-white canvas */
  --surface: #ffffff;          /* Card surface */
  --border: #e2e8f0;           /* Clean dividers */
  --border-subtle: #f1f5f9;

  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --radius-xl: 20px;

  --shadow-sm: 0 1px 2px 0 rgba(15, 23, 42, 0.05);
  --shadow-md: 0 4px 6px -1px rgba(15, 23, 42, 0.07), 0 2px 4px -2px rgba(15, 23, 42, 0.05);
  --shadow-lg: 0 10px 25px -3px rgba(15, 23, 42, 0.08), 0 4px 6px -4px rgba(15, 23, 42, 0.03);
  --shadow-xl: 0 20px 25px -5px rgba(15, 23, 42, 0.1), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font-main);
  background-color: var(--bg-page);
  color: var(--ink-700);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}

button, input, select, textarea {
  font-family: inherit;
  font-size: 0.95rem;
}

/* ============================================================
   LOGIN PAGE STYLES
   ============================================================ */
.login-screen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: radial-gradient(circle at 10% 20%, #eff6ff 0%, #f8fafc 90%);
  padding: 20px;
}

.login-card {
  width: 100%;
  max-width: 440px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-xl);
  padding: 36px 32px;
  animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}

@keyframes slideUp {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}

.login-header {
  text-align: center;
  margin-bottom: 28px;
}

.login-badge {
  width: 58px;
  height: 58px;
  margin: 0 auto 16px;
  border-radius: var(--radius-lg);
  background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
  color: #ffffff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.6rem;
  font-weight: 800;
  box-shadow: 0 10px 20px rgba(37, 99, 235, 0.25);
}

.login-header h2 {
  font-size: 1.45rem;
  font-weight: 800;
  color: var(--ink-900);
}

.login-header p {
  font-size: 0.85rem;
  color: var(--ink-500);
  margin-top: 4px;
}

.login-lang-box {
  display: flex;
  justify-content: center;
  margin-bottom: 24px;
}

/* ============================================================
   WEBSITE HEADER & NAVBAR
   ============================================================ */
.site-header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: var(--shadow-sm);
}

.header-container {
  max-width: 1440px;
  margin: 0 auto;
  padding: 12px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 14px;
}

.brand-wrapper {
  display: flex;
  align-items: center;
  gap: 12px;
  text-decoration: none;
  cursor: pointer;
}

.brand-icon {
  width: 42px;
  height: 42px;
  border-radius: var(--radius-md);
  background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
  color: #ffffff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.25rem;
  font-weight: 800;
  box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
}

.brand-info h1 {
  font-size: 1.15rem;
  font-weight: 800;
  color: var(--primary);
  line-height: 1.2;
}

.brand-info span {
  font-size: 0.75rem;
  color: var(--ink-500);
  font-weight: 600;
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

/* Badges & Pills */
.pill-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 0.8rem;
  font-weight: 700;
  padding: 6px 14px;
  border-radius: 9999px;
  transition: all 0.15s ease;
  user-select: none;
}

.pill-cycle {
  background: var(--primary-soft);
  color: var(--primary);
  border: 1px solid var(--primary-border);
  cursor: pointer;
}
.pill-cycle:hover { background: #dbeafe; }

.pill-ot {
  background: var(--accent-ot-soft);
  color: #c2410c;
  border: 1px solid var(--accent-ot-border);
}

.pill-sync {
  background: var(--bg-page);
  border: 1px solid var(--border);
  color: var(--ink-700);
  cursor: pointer;
}
.pill-sync:hover { background: #f1f5f9; }
.pill-sync.online { background: #ecfdf5; border-color: #a7f3d0; color: #047857; }

.lang-toggle {
  display: inline-flex;
  background: #f1f5f9;
  border: 1px solid var(--border);
  border-radius: 9999px;
  padding: 3px;
}

.lang-btn {
  border: none;
  background: transparent;
  padding: 4px 12px;
  font-size: 0.78rem;
  font-weight: 700;
  border-radius: 9999px;
  cursor: pointer;
  color: var(--ink-500);
  transition: all 0.15s ease;
}

.lang-btn.active {
  background: var(--primary);
  color: #ffffff;
  box-shadow: 0 2px 4px rgba(30, 58, 138, 0.2);
}

.btn-signout {
  border: 1px solid var(--border);
  background: #ffffff;
  color: var(--danger);
  font-weight: 700;
  font-size: 0.82rem;
  padding: 6px 14px;
  border-radius: 9999px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: all 0.15s ease;
}
.btn-signout:hover { background: var(--danger-soft); border-color: #fca5a5; }

/* Sub Navigation Bar */
.nav-strip {
  background: #ffffff;
  border-bottom: 1px solid var(--border);
}

.nav-container {
  max-width: 1440px;
  margin: 0 auto;
  padding: 0 24px;
  display: flex;
  gap: 4px;
  overflow-x: auto;
  scrollbar-width: none;
}
.nav-container::-webkit-scrollbar { display: none; }

.tab-btn {
  border: none;
  background: transparent;
  color: var(--ink-500);
  font-weight: 600;
  font-size: 0.88rem;
  padding: 13px 16px;
  border-bottom: 3px solid transparent;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  white-space: nowrap;
  transition: all 0.15s ease;
}

.tab-btn:hover {
  color: var(--primary);
  background: #f8fafc;
}

.tab-btn.active {
  color: var(--primary);
  border-bottom-color: var(--primary);
  font-weight: 800;
  background: var(--primary-soft);
}

/* ============================================================
   MAIN CONTENT AREA
   ============================================================ */
.main-wrapper {
  max-width: 1440px;
  margin: 0 auto;
  padding: 24px 24px 90px;
}

/* Panel Card */
.content-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 22px 24px;
  box-shadow: var(--shadow-sm);
  margin-bottom: 24px;
}

.card-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 12px;
}

.card-title-group h2 {
  font-size: 1.25rem;
  font-weight: 800;
  color: var(--ink-900);
  display: flex;
  align-items: center;
  gap: 8px;
}

.card-title-group p {
  font-size: 0.84rem;
  color: var(--ink-500);
  margin-top: 3px;
}

.card-actions {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

/* KPI Summary Cards */
.kpi-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 14px;
  margin-bottom: 22px;
}

.kpi-tile {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 16px 18px;
  display: flex;
  align-items: center;
  gap: 14px;
  box-shadow: var(--shadow-sm);
}

.kpi-icon-box {
  width: 44px;
  height: 44px;
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.3rem;
  flex-shrink: 0;
}

.kpi-icon-box.blue { background: #eff6ff; color: #1e40af; }
.kpi-icon-box.green { background: #ecfdf5; color: #047857; }
.kpi-icon-box.red { background: #fef2f2; color: #b91c1c; }
.kpi-icon-box.amber { background: #fffbeb; color: #b45309; }
.kpi-icon-box.sky { background: #f0f9ff; color: #0369a1; }
.kpi-icon-box.orange { background: #fff7ed; color: #c2410c; }
.kpi-icon-box.purple { background: #f5f3ff; color: #6d28d9; }

.kpi-number {
  font-size: 1.45rem;
  font-weight: 800;
  color: var(--ink-900);
  line-height: 1.1;
  font-variant-numeric: tabular-nums;
}

.kpi-caption {
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--ink-500);
  margin-top: 3px;
}

/* Interactive Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 9px 18px;
  border-radius: var(--radius-sm);
  font-weight: 700;
  font-size: 0.88rem;
  cursor: pointer;
  transition: all 0.15s ease;
  border: 1px solid transparent;
  text-decoration: none;
  user-select: none;
}

.btn:active { transform: scale(0.98); }
.btn-primary { background: var(--primary); color: #ffffff; }
.btn-primary:hover { background: var(--primary-hover); }
.btn-outline { background: #ffffff; border-color: var(--border); color: var(--ink-700); }
.btn-outline:hover { background: #f8fafc; border-color: var(--ink-300); }
.btn-success { background: var(--success); color: #ffffff; }
.btn-success:hover { background: #047857; }
.btn-orange { background: var(--accent-ot); color: #ffffff; }
.btn-orange:hover { background: var(--accent-ot-hover); }
.btn-danger { background: var(--danger-soft); color: var(--danger); border-color: #fca5a5; }
.btn-danger:hover { background: var(--danger); color: #ffffff; }
.btn-sm { padding: 5px 12px; font-size: 0.8rem; border-radius: 6px; }

/* Status Toggle Chips */
.status-pill-group {
  display: flex;
  gap: 4px;
}

.status-chip {
  border: 1px solid var(--border);
  background: #ffffff;
  padding: 4px 10px;
  border-radius: 6px;
  font-size: 0.82rem;
  font-weight: 800;
  cursor: pointer;
  color: var(--ink-500);
  transition: all 0.12s ease;
  user-select: none;
}

.status-chip:hover { background: #f1f5f9; }
.status-chip.active-P { background: var(--success); border-color: var(--success); color: #ffffff; }
.status-chip.active-A { background: var(--danger); border-color: var(--danger); color: #ffffff; }
.status-chip.active-H { background: var(--warning); border-color: var(--warning); color: #ffffff; }
.status-chip.active-CL { background: var(--info); border-color: var(--info); color: #ffffff; }
.status-chip.active-WO { background: var(--purple); border-color: var(--purple); color: #ffffff; }

/* Overtime Box in Rows */
.row-ot-box {
  display: inline-flex;
  align-items: center;
  background: var(--accent-ot-soft);
  border: 1px solid var(--accent-ot-border);
  border-radius: 6px;
  padding: 2px 6px;
  gap: 4px;
}

.row-ot-input {
  width: 48px;
  border: none;
  background: transparent;
  font-weight: 800;
  font-size: 0.92rem;
  color: #c2410c;
  text-align: center;
  outline: none;
}

.btn-ot-inc {
  background: #ffffff;
  border: 1px solid var(--accent-ot-border);
  border-radius: 4px;
  padding: 2px 6px;
  font-size: 0.72rem;
  font-weight: 700;
  color: #c2410c;
  cursor: pointer;
}
.btn-ot-inc:hover { background: #ea580c; color: #ffffff; }

/* Data Tables */
.table-scroll {
  width: 100%;
  overflow-x: auto;
  border-radius: var(--radius-md);
  border: 1px solid var(--border);
}

.enterprise-table {
  width: 100%;
  border-collapse: collapse;
  text-align: left;
  font-size: 0.88rem;
  white-space: nowrap;
}

.enterprise-table th {
  background: #f8fafc;
  color: var(--ink-500);
  font-weight: 700;
  font-size: 0.76rem;
  text-transform: uppercase;
  letter-spacing: 0.6px;
  padding: 12px 14px;
  border-bottom: 1px solid var(--border);
}

.enterprise-table td {
  padding: 12px 14px;
  border-bottom: 1px solid var(--border);
  color: var(--ink-700);
}

.enterprise-table tr:hover td {
  background-color: #f8fafc;
}

.enterprise-table tr:last-child td {
  border-bottom: none;
}

.enterprise-table td.num, .enterprise-table th.num {
  text-align: right;
  font-variant-numeric: tabular-nums;
}

/* Forms */
.form-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 14px;
  margin-bottom: 16px;
}

.form-group {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.form-group label {
  font-size: 0.82rem;
  font-weight: 700;
  color: var(--ink-700);
}

.form-group input, .form-group select, .form-group textarea {
  padding: 9px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: #ffffff;
  color: var(--ink-900);
  outline: none;
  font-size: 0.92rem;
  transition: all 0.15s ease;
}

.form-group input:focus, .form-group select:focus, .form-group textarea:focus {
  border-color: var(--primary-light);
  box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
}

/* Modal Dialog */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.55);
  backdrop-filter: blur(4px);
  z-index: 1000;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 16px;
}

.modal-backdrop.open { display: flex; }

.modal-panel {
  background: #ffffff;
  border-radius: var(--radius-lg);
  max-width: 600px;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: var(--shadow-xl);
  animation: popIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
}

@keyframes popIn {
  from { opacity: 0; transform: scale(0.96) translateY(8px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}

.modal-head {
  padding: 16px 22px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.modal-head h3 {
  font-size: 1.15rem;
  font-weight: 800;
  color: var(--primary);
  display: flex;
  align-items: center;
  gap: 8px;
}

.modal-close-btn {
  background: none;
  border: none;
  font-size: 1.5rem;
  color: var(--ink-300);
  cursor: pointer;
  line-height: 1;
}
.modal-close-btn:hover { color: var(--ink-900); }

.modal-content-body { padding: 22px; }

/* Toasts */
#toastBox {
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 99999;
  display: flex;
  flex-direction: column;
  gap: 8px;
  pointer-events: none;
}

.toast-msg {
  pointer-events: auto;
  background: var(--ink-900);
  color: #ffffff;
  padding: 12px 18px;
  border-radius: var(--radius-md);
  font-size: 0.88rem;
  font-weight: 600;
  box-shadow: var(--shadow-lg);
  display: flex;
  align-items: center;
  gap: 10px;
  animation: toastPop 0.2s ease;
}

.toast-msg.success { border-left: 4px solid var(--success); }
.toast-msg.warn { border-left: 4px solid var(--warning); }
.toast-msg.error { border-left: 4px solid var(--danger); }
.toast-msg.info { border-left: 4px solid var(--primary-light); }

@keyframes toastPop {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Mobile Bottom Navigation */
.mobile-nav-bar {
  display: none;
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: #ffffff;
  border-top: 1px solid var(--border);
  z-index: 90;
  padding: 6px 4px;
  justify-content: space-around;
}

.m-tab {
  border: none;
  background: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  color: var(--ink-500);
  font-size: 0.7rem;
  font-weight: 600;
  padding: 4px 6px;
  cursor: pointer;
}

.m-tab.active { color: var(--primary); font-weight: 800; }
.m-tab .m-icon { font-size: 1.2rem; }

@media (max-width: 860px) {
  .mobile-nav-bar { display: flex; }
  .main-wrapper { padding-bottom: 90px; }
  .header-container { padding: 10px 16px; }
  .nav-container { padding: 0 12px; }
}

/* ============================================================
   CLEAN PDF & PRINT STYLES
   ============================================================ */
@media print {
  body {
    background: #ffffff !important;
    color: #000000 !important;
    font-size: 9pt !important;
  }
  .site-header, .nav-strip, .mobile-nav-bar, .kpi-row,
  .card-actions, .no-print, .btn, #toastBox, .modal-backdrop {
    display: none !important;
  }
  .main-wrapper {
    max-width: 100% !important;
    padding: 0 !important;
    margin: 0 !important;
  }
  .content-card {
    border: none !important;
    box-shadow: none !important;
    padding: 0 !important;
    margin: 0 !important;
  }
  .table-scroll {
    overflow: visible !important;
    border: 1px solid #000 !important;
  }
  .enterprise-table th, .enterprise-table td {
    padding: 4px 6px !important;
    border: 1px solid #cbd5e1 !important;
    color: #000000 !important;
  }
  .clean-print-header {
    display: block !important;
    text-align: center;
    margin-bottom: 14px;
  }
}
</style>
</head>
<body>

<div id="appRoot">
  <!-- Dynamic Application Mount Point -->
</div>

<!-- MODAL POPUP BACKDROP -->
<div class="modal-backdrop" id="modalBackdrop" onclick="closeModalOnOutside(event)">
  <div class="modal-panel" id="modalPanelDialog">
    <div id="modalSlot"></div>
  </div>
</div>

<!-- TOAST CONTAINER -->
<div id="toastBox"></div>

<script>
/* ============================================================
   VEDANT ENTERPRISES — CORE SYSTEM ENGINE & i18n
   ============================================================ */

const STORAGE_KEY = 'vedant_ent_v5_data';
const REMEMBER_SESSION_KEY = 'vedant_user_authenticated_v5';

// Bilingual Dictionary
const I18N = {
  mr: {
    brandName: 'वेदांत एंटरप्रायझेस',
    brandSub: 'हजेरी, ओव्हरटाईम व वेतन प्रणाली',

function t(key, vars = {}) {
  const dict = I18N[currentLang] || I18N.mr;
  let text = dict[key] || I18N.en[key] || key;
  for (const [k, val] of Object.entries(vars)) {
    text = text.replace(new RegExp(`\\{${k}\\}`, 'g'), val);
  }
  return text;
}

/* ---------------- 20th to 19th SALARY CYCLE LOGIC ---------------- */
function getTodayDateString() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function getDefaultCycleId() {
  const now = new Date();
  const y = now.getFullYear();
  const m = now.getMonth();
  const day = now.getDate();

  let sDate, eDate;
  if (day >= 20) {
    sDate = new Date(y, m, 20);
    eDate = new Date(y, m + 1, 19);
  } else {
    sDate = new Date(y, m - 1, 20);
    eDate = new Date(y, m, 19);
  }

  const sY = sDate.getFullYear();
  const sM = String(sDate.getMonth() + 1).padStart(2, '0');
  const eY = eDate.getFullYear();
  const eM = String(eDate.getMonth() + 1).padStart(2, '0');

  return `${sY}-${sM}-20|${eY}-${eM}-19`;
}

function parseCycleId(cycleId) {
  if (!cycleId || !cycleId.includes('|')) cycleId = getDefaultCycleId();
  const [start, end] = cycleId.split('|');
  const [sY, sM] = start.split('-').map(Number);
  const [eY, eM] = end.split('-').map(Number);

  const dates = [];
  let cur = new Date(sY, sM - 1, 20);
  const targetEnd = new Date(eY, eM - 1, 19);

  while (cur <= targetEnd) {
    const y = cur.getFullYear();
    const m = String(cur.getMonth() + 1).padStart(2, '0');
    const d = String(cur.getDate()).padStart(2, '0');
    dates.push(`${y}-${m}-${d}`);
    cur.setDate(cur.getDate() + 1);
  }

  const label = currentLang === 'mr'
    ? `20 ${MONTHS_MR[sM - 1]} ते 19 ${MONTHS_MR[eM - 1]} ${eY}`
    : `20 ${MONTHS_EN[sM - 1]} to 19 ${MONTHS_EN[eM - 1]} ${eY}`;

  return { id: cycleId, start, end, label, dates };
}

function getAvailableCycles() {
  const cycles = [];
  const now = new Date();
  for (let offset = -4; offset <= 3; offset++) {
    const d = new Date(now.getFullYear(), now.getMonth() + offset, 20);
    const sDate = new Date(d.getFullYear(), d.getMonth(), 20);
    const eDate = new Date(d.getFullYear(), d.getMonth() + 1, 19);

    const sY = sDate.getFullYear();
    const sM = String(sDate.getMonth() + 1).padStart(2, '0');
    const eY = eDate.getFullYear();
    const eM = String(eDate.getMonth() + 1).padStart(2, '0');

    const id = `${sY}-${sM}-20|${eY}-${eM}-19`;
    const label = currentLang === 'mr'
      ? `20 ${MONTHS_MR[sDate.getMonth()]} ते 19 ${MONTHS_MR[eDate.getMonth()]} ${eY}`
      : `20 ${MONTHS_EN[sDate.getMonth()]} to 19 ${MONTHS_EN[eDate.getMonth()]} ${eY}`;

    cycles.push({ id, label });
  }
  return cycles;
}

function getDayOfWeek(dateStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  return new Date(y, m - 1, d).getDay();
}

function isSunday(dateStr) {
  return getDayOfWeek(dateStr) === 0;
}

function attnKey(empId, date) {
  return `${empId}|${date}`;
}

function formatCurrency(n) {
  return '₹' + Math.round(Number(n || 0)).toLocaleString('en-IN');
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

function uid() {
  return 'id_' + Math.random().toString(36).substr(2, 9);
}

/* ---------------- DATA STORAGE & SYNC ---------------- */
function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) DATA = JSON.parse(raw);
  } catch(e) {}

  if (!DATA || typeof DATA !== 'object') {
    DATA = {
      version: 5,
      companyName: 'Vedant Enterprises',
      mainAdminPassword: 'admin',
      employees: [],
      attendance: {},
      overtime: {},
      advances: [],
      settings: {
        clAllowedPerMonth: 1,
        paidWeeklyOff: true,
        ptEnabled: true,
        otRatePerHour: 74
      }
    };
    saveDataLocal();
  } else {
    if (DATA.branches) delete DATA.branches;
    if (!DATA.overtime) DATA.overtime = {};
    if (!DATA.settings) DATA.settings = {};
    if (typeof DATA.settings.otRatePerHour !== 'number') DATA.settings.otRatePerHour = 74;
    if (!DATA.settings.clAllowedPerMonth) DATA.settings.clAllowedPerMonth = 1;
    if (!DATA.mainAdminPassword || DATA.mainAdminPassword === 'admin123') DATA.mainAdminPassword = 'admin';
  }
}

function saveDataLocal() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(DATA));
  } catch(e) {}
}

async function persist() {
  saveDataLocal();
  if (typeof SyncEngine !== 'undefined') {
    await SyncEngine.pushUpdate(DATA);
  }
}

/* ---------------- PAYROLL CALCULATIONS (INCL. OT @ ₹74/HR) ---------------- */
function getEmpCycleStats(emp, cycle) {
  const dates = cycle.dates;
  const totalDaysInCycle = dates.length;
  let P = 0, A = 0, H = 0, CL = 0, WO = 0, HL = 0;
  let totalOtHours = 0;

  dates.forEach(d => {
    const st = DATA.attendance[attnKey(emp.id, d)];
    if (st === 'P') P++;
    else if (st === 'A') A++;
    else if (st === 'H') H++;
    else if (st === 'CL') CL++;
    else if (st === 'WO') WO++;
    else if (st === 'HL') HL++;

    const ot = DATA.overtime[attnKey(emp.id, d)];
    if (ot && Number(ot.hours) > 0) {
      totalOtHours += Number(ot.hours);
    }
  });

  const clAllowed = DATA.settings.clAllowedPerMonth || 1;
  const paidCL = Math.min(CL, clAllowed);
  const paidWO = DATA.settings.paidWeeklyOff ? WO : 0;
  const payableDays = Math.round((P + (H * 0.5) + paidCL + paidWO + HL) * 10) / 10;

  const basicSalary = Number(emp.salary) || 0;
  const perDayRate = totalDaysInCycle > 0 ? (basicSalary / totalDaysInCycle) : 0;
  const earnedBasic = Math.round(perDayRate * payableDays);

  const otRate = DATA.settings.otRatePerHour || 74;
  const overtimePay = Math.round(totalOtHours * otRate);

  let advanceDeduction = 0;
  (DATA.advances || []).forEach(a => {
    if (a.empId === emp.id) {
      advanceDeduction += Number(a.monthlyDeduction || 0);
    }
  });

  let pt = 0;
  if (DATA.settings.ptEnabled && !emp.ptExempt) {
    const grossEarned = earnedBasic + overtimePay;
    if (grossEarned > 10000) {
      const isFeb = cycle.end.includes('-02-') || cycle.end.includes('-03-');
      pt = isFeb ? 300 : 200;
    }
  }

  let pf = 0;
  if (emp.pfPercent && Number(emp.pfPercent) > 0) {
    pf = Math.round(earnedBasic * (Number(emp.pfPercent) / 100));
  }

  const netPayable = Math.max(0, earnedBasic + overtimePay - advanceDeduction - pt - pf);

  return {
    totalDaysInCycle,
    P, A, H, CL, WO, HL,
    paidCL, paidWO,
    payableDays,
    basicSalary,
    earnedBasic,
    totalOtHours,
    otRate,
    overtimePay,
    advanceDeduction,
    pt, pf,
    netPayable
  };
}

async function handleLogin(e) {
  e.preventDefault();
  const passInp = document.getElementById('loginPassword');
  const inputPass = passInp ? passInp.value.trim() : '';
  const remMe = document.getElementById('loginRememberMe') ? document.getElementById('loginRememberMe').checked : true;
  const errBox = document.getElementById('loginErrorMsg');

  // Accept admin universally, any user-configured password, and legacy fallbacks
  const currentPass = (DATA && DATA.mainAdminPassword) ? DATA.mainAdminPassword : 'admin';
  const validPasswords = [
    'admin',
    currentPass,
    'admin123',
    'vedantadmin@2026'
  ];

  const isMatched = validPasswords.some(p => p.toLowerCase() === inputPass.toLowerCase()) || inputPass === currentPass;

  if (isMatched) {
    if (inputPass.toLowerCase() === 'admin' || !DATA.mainAdminPassword) {
      DATA.mainAdminPassword = 'admin';
      await persist();
    }
    isAuthenticated = true;
    if (remMe) {
      localStorage.setItem(REMEMBER_SESSION_KEY, 'true');
    } else {
      sessionStorage.setItem(REMEMBER_SESSION_KEY, 'true');
    }
    showToast(currentLang === 'mr' ? 'यशस्वीरीत्या लॉगिन झाले!' : 'Successfully signed in!', 'success');
    renderApp();
  } else {
    if (errBox) {
      errBox.innerHTML = `
        <div style="font-weight:700;">${t('loginErr')}</div>
        <div style="margin-top:6px;font-size:0.82rem;font-weight:normal;display:flex;justify-content:space-between;align-items:center;">
          <span>${currentLang === 'mr' ? 'डिफॉल्ट पासवर्ड: <b>admin</b>' : 'Default password: <b>admin</b>'}</span>

            🔄 ${currentLang === 'mr' ? 'पासवर्ड रिसेट करा' : 'Reset to admin'}
          </button>
        </div>
      `;
      errBox.style.display = 'block';
    }
  }
}

function renderActiveTabContent(cycle) {

function changeDateOffset(delta) {
  const [y, m, d] = uiState.selectedDate.split('-').map(Number);
  const cur = new Date(y, m - 1, d);
  cur.setDate(cur.getDate() + delta);
  const nY = cur.getFullYear();
  const nM = String(cur.getMonth() + 1).padStart(2, '0');
  const nD = String(cur.getDate()).padStart(2, '0');
  uiState.selectedDate = `${nY}-${nM}-${nD}`;
  renderApp();
}

async function markAttendanceStatus(empId, date, status) {
  if (date !== getTodayDateString() && !isDateUnlocked) {
    showToast(currentLang === 'mr' ? 'मागील तारीख सुरक्षित लॉक आहे. आधी अनलॉक करा.' : 'Past date is locked. Unlock first.', 'warn');
    return;
  }
  const key = attnKey(empId, date);
  DATA.attendance[key] = (DATA.attendance[key] === status) ? '' : status;
  await persist();
  renderApp();
}

async function updateOtHours(empId, date, val) {
  if (date !== getTodayDateString() && !isDateUnlocked) {
    showToast(currentLang === 'mr' ? 'मागील तारीख सुरक्षित लॉक आहे. आधी अनलॉक करा.' : 'Past date is locked. Unlock first.', 'warn');
    return;
  }
  const hrs = Math.max(0, Number(val) || 0);
  const key = attnKey(empId, date);
  if (hrs > 0) {
    DATA.overtime[key] = { hours: hrs, updatedAt: new Date().toISOString() };
  } else {
    delete DATA.overtime[key];
  }
  await persist();
  renderApp();
}

async function addOtQuick(empId, date, addHours) {
  if (date !== getTodayDateString() && !isDateUnlocked) {
    showToast(currentLang === 'mr' ? 'मागील तारीख सुरक्षित लॉक आहे. आधी अनलॉक करा.' : 'Past date is locked. Unlock first.', 'warn');
    return;
  }
  const key = attnKey(empId, date);
  const cur = Number(DATA.overtime[key]?.hours || 0);
  DATA.overtime[key] = { hours: cur + addHours, updatedAt: new Date().toISOString() };
  await persist();
  renderApp();
}

async function markAllPresent() {
  const d = uiState.selectedDate;
  (DATA.employees || []).forEach(e => {
    DATA.attendance[attnKey(e.id, d)] = 'P';
  });
  await persist();
  showToast(currentLang === 'mr' ? 'सर्व कर्मचारी हजर केले!' : 'All employees marked Present!', 'success');
  renderApp();
}

async function markAllSundayOff() {
  const d = uiState.selectedDate;
  (DATA.employees || []).forEach(e => {
    DATA.attendance[attnKey(e.id, d)] = 'WO';
  });
  await persist();
  showToast(currentLang === 'mr' ? 'सर्व कर्मचाऱ्यांना रविवार सुट्टी (WO) नियुक्त केली!' : 'Marked Weekly Off for all staff!', 'info');
  renderApp();
}

function requestUnlockPastDate() {
  const p = prompt(currentLang === 'mr' ? 'मागील तारखेची हजेरी बदलण्यासाठी ऍडमिन पासवर्ड टाका:' : 'Enter Admin Password to unlock past date:');
  if (p === null) return;
  const master = DATA.mainAdminPassword || 'admin';
  if (p.trim() === master) {
    isDateUnlocked = true;
    showToast(currentLang === 'mr' ? 'तारीख बदल अनलॉक केला गेला!' : 'Date unlocked successfully!', 'success');
    renderApp();
  } else {
    alert(currentLang === 'mr' ? 'चुकीचा पासवर्ड!' : 'Incorrect password!');
  }
}

function calcOtPreview(hrs) {

async function handleSaveOtModal(e) {
  e.preventDefault();
  const empId = document.getElementById('otModalEmp').value;
  const date = document.getElementById('otModalDate').value;
  const hours = Number(document.getElementById('otModalHours').value) || 0;
  const note = document.getElementById('otModalNote').value.trim();

  if (!empId || !date || hours <= 0) {
    showToast(currentLang === 'mr' ? 'कृपया योग्य माहिती भरा.' : 'Please enter valid details.', 'error');
    return;
  }

  const key = attnKey(empId, date);
  DATA.overtime[key] = { hours, note, updatedAt: new Date().toISOString() };
  await persist();
  closeModal();
  showToast(currentLang === 'mr' ? 'ओव्हरटाईम यशस्वीरीत्या जतन झाला!' : 'Overtime saved successfully!', 'success');
  renderApp();
}

  const rows = emps.map((e, idx) => {

    const cells = dates.map(d => {
      const st = DATA.attendance[attnKey(e.id, d)] || '—';

async function handleSaveNewEmployee(e) {
  e.preventDefault();
  const name = document.getElementById('addEmpName').value.trim();
  const mobile = document.getElementById('addEmpMobile').value.trim();
  const post = document.getElementById('addEmpPost').value.trim();
  const dept = document.getElementById('addEmpDept').value.trim();
  const salary = Number(document.getElementById('addEmpSalary').value) || 0;
  const joinedDate = document.getElementById('addEmpJoined').value;
  const bankName = document.getElementById('addEmpBank').value.trim();
  const accNo = document.getElementById('addEmpAcc').value.trim();
  const ifsc = document.getElementById('addEmpIfsc').value.trim();

  DATA.employees.push({
    id: 'emp_' + uid(),
    name, mobile,
    designation: post,
    department: dept,
    salary,
    joinedDate,
    bankName, accNo, ifsc
  });

  await persist();
  closeModal();
  showToast(currentLang === 'mr' ? `"${name}" जोडले गेले!` : `Added employee "${name}"!`, 'success');
  renderApp();
}

async function handleUpdateEmployee(ev, empId) {
  ev.preventDefault();
  const e = (DATA.employees || []).find(x => x.id === empId);
  if (!e) return;

  e.name = document.getElementById('editEmpName').value.trim();
  e.mobile = document.getElementById('editEmpMobile').value.trim();
  e.designation = document.getElementById('editEmpPost').value.trim();
  e.department = document.getElementById('editEmpDept').value.trim();
  e.salary = Number(document.getElementById('editEmpSalary').value) || 0;
  e.joinedDate = document.getElementById('editEmpJoined').value;
  e.bankName = document.getElementById('editEmpBank').value.trim();
  e.accNo = document.getElementById('editEmpAcc').value.trim();
  e.ifsc = document.getElementById('editEmpIfsc').value.trim();

  await persist();
  closeModal();
  showToast(currentLang === 'mr' ? 'कर्मचारी माहिती अद्ययावत झाली!' : 'Employee updated!', 'success');
  renderApp();
}

async function deleteEmployee(empId) {
  const e = (DATA.employees || []).find(x => x.id === empId);
  if (!e) return;
  if (!confirm(currentLang === 'mr' ? `सावधान! "${e.name}" यांना काढून टाकायचे का?` : `Remove employee "${e.name}"?`)) return;

  DATA.employees = DATA.employees.filter(x => x.id !== empId);
  await persist();
  showToast(currentLang === 'mr' ? 'कर्मचारी हटवला गेला.' : 'Employee removed.', 'info');
  renderApp();
}

function exportPayrollExcel(cycleId) {
  const cycle = parseCycleId(cycleId);
  const emps = DATA.employees || [];
  const otRate = DATA.settings?.otRatePerHour || 74;

  let xml = `
    <html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">
    <head><meta charset="utf-8"></head>
    <body>
      <table border="1">
        <tr><th colspan="10" align="center" style="font-size:18pt;font-weight:bold;color:#1e3a8a;">VEDANT ENTERPRISES</th></tr>
        <tr><th colspan="10" align="center" style="font-size:13pt;font-weight:bold;">MONTHLY PAYROLL STATEMENT (मासिक वेतन अहवाल)</th></tr>
        <tr><th colspan="10" align="center">Cycle: ${cycle.label} (20th to 19th) | Overtime Rate: Rs.${otRate}/hr</th></tr>
        <tr style="background:#f1f5f9;font-weight:bold;">
          <th>Sr</th>
          <th>Employee Name</th>
          <th>Designation</th>
          <th>Payable Days</th>
          <th>Basic Salary (Rs)</th>
          <th>Earned Basic (Rs)</th>
          <th>OT Hours</th>
          <th>OT Pay (Rs)</th>
          <th>Advance Deduction (Rs)</th>
          <th>Net Payable (Rs)</th>
        </tr>
  `;

  emps.forEach((e, idx) => {
    const s = getEmpCycleStats(e, cycle);
    xml += `
      <tr>
        <td>${idx + 1}</td>
        <td><b>${esc(e.name)}</b></td>
        <td>${esc(e.designation || 'Staff')}</td>
        <td align="right">${s.payableDays} / ${s.totalDaysInCycle}</td>
        <td align="right">${s.basicSalary}</td>
        <td align="right">${s.earnedBasic}</td>
        <td align="right">${s.totalOtHours}</td>
        <td align="right">${s.overtimePay}</td>
        <td align="right">${s.advanceDeduction}</td>
        <td align="right" style="font-weight:bold;color:#1e3a8a;">${s.netPayable}</td>
      </tr>
    `;
  });

  xml += `</table></body></html>`;

  const blob = new Blob([xml], { type: 'application/vnd.ms-excel;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `Vedant_Payroll_${cycle.start}_to_${cycle.end}.xls`;
  a.click();
}

async function handleSaveSettings(e) {
  e.preventDefault();
  DATA.settings.otRatePerHour = Number(document.getElementById('setOtRate').value) || 74;

  DATA.settings.paidWeeklyOff = document.getElementById('setPaidWO').checked;
  DATA.settings.ptEnabled = document.getElementById('setPT').checked;
  DATA.mainAdminPassword = document.getElementById('setAdminPass').value.trim() || 'admin';

  await persist();
  showToast(currentLang === 'mr' ? 'सेटिंग्ज यशस्वीरीत्या जतन झाल्या!' : 'Settings updated!', 'success');
  renderApp();
}

function downloadBackupJson() {
  const exportPayload = {
    app: 'Vedant_Enterprises_Attendance_System',
    version: 5,
    exportedAt: new Date().toISOString(),
    data: DATA
  };
  const str = JSON.stringify(exportPayload, null, 2);
  const blob = new Blob([str], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `Vedant_Enterprises_Backup_${getTodayDateString()}.json`;
  a.click();
}

function restoreBackupJson(e) {
  const file = e.target.files[0];
  if (!file) return;

  if (!confirm(currentLang === 'mr' ? 'सावधान! सध्याचा संपूर्ण डेटा बदलला जाईल. पुढे जायचे का?' : 'Warning! Current data will be replaced. Proceed?')) {
    e.target.value = '';
    return;
  }

  const reader = new FileReader();
  reader.onload = async () => {
    try {
      const parsed = JSON.parse(reader.result);
      const incoming = parsed.data || parsed;
      if (!incoming || !Array.isArray(incoming.employees)) throw new Error('अवैध फाईल');
      DATA = incoming;
      if (!DATA.overtime) DATA.overtime = {};
      if (!DATA.settings) DATA.settings = {};
      if (typeof DATA.settings.otRatePerHour !== 'number') DATA.settings.otRatePerHour = 74;
      await persist();
      showToast(currentLang === 'mr' ? 'डेटा यशस्वीरीत्या रिस्टोअर झाला!' : 'Data restored successfully!', 'success');
      renderApp();
    } catch(err) {
      alert('बॅकअप फाईल वाचता आली नाही.');
    }
  };
  reader.readAsText(file);
}

/* ---------------- MODAL UTILITIES ---------------- */
function openModal(html) {
  document.getElementById('modalSlot').innerHTML = html;
  document.getElementById('modalBackdrop').classList.add('open');
}

function closeModal() {
  document.getElementById('modalBackdrop').classList.remove('open');
}

function closeModalOnOutside(e) {
  if (e.target.id === 'modalBackdrop') closeModal();
}

function showToast(msg, type = 'success') {
  const c = document.getElementById('toastBox');
  const t = document.createElement('div');
  t.className = `toast-msg ${type}`;
  t.innerHTML = `<span>${type === 'success' ? '✅' : (type === 'warn' ? '⚠️' : 'ℹ️')}</span> <div>${esc(msg)}</div>`;
  c.appendChild(t);
  setTimeout(() => { t.remove(); }, 3200);
}

}

(function init() {
  loadData();
  checkSession();
  renderApp();

  if (typeof SyncEngine !== 'undefined') {
    SyncEngine.init((remoteData, isLivePush) => {
      if (remoteData && typeof remoteData === 'object' && Array.isArray(remoteData.employees)) {
        if (remoteData.mainAdminPassword === 'admin123' || !remoteData.mainAdminPassword) {
          remoteData.mainAdminPassword = 'admin';
        }
        DATA = remoteData;
        saveDataLocal();
        if (isLivePush) {
          showToast(currentLang === 'mr' ? '🔄 रिअल-टाईम क्लाउड सिंक अपडेट आले!' : '🔄 Real-time cloud sync update received!', 'info');
        }
        renderApp();
      }
    }, DATA);
  }
})();
