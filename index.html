<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vedant Enterprises | Attendance & Salary Management System</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#1e40af">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- Firebase Cloud & Real-Time Sync SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<!-- Real-Time Sync Engine -->
<script src="sync.js"></script>

<style>
/* ============================================================
   DESIGN SYSTEM & THEME
   ============================================================ */
:root {
  --primary: #1e40af;
  --primary-dark: #1e3a8a;
  --primary-light: #3b82f6;
  --primary-soft: #eff6ff;
  --accent: #0d9488;
  --accent-soft: #f0fdfa;
  --ink: #0f172a;
  --ink-muted: #475569;
  --ink-light: #94a3b8;
  --bg-page: #f8fafc;
  --card-bg: #ffffff;
  --border: #e2e8f0;
  --border-focus: #93c5fd;

  /* Status Colors */
  --c-present: #10b981;
  --c-present-bg: #ecfdf5;
  --c-present-text: #065f46;
  --c-absent: #ef4444;
  --c-absent-bg: #fef2f2;
  --c-absent-text: #991b1b;
  --c-half: #f59e0b;
  --c-half-bg: #fffbeb;
  --c-half-text: #92400e;
  --c-cl: #3b82f6;
  --c-cl-bg: #eff6ff;
  --c-cl-text: #1e40af;
  --c-wo: #8b5cf6;
  --c-wo-bg: #f5f3ff;
  --c-wo-text: #5b21b6;
  --c-hl: #ec4899;
  --c-hl-bg: #fdf2f8;
  --c-hl-text: #9d174d;

  --sidebar-w: 260px;
  --radius-sm: 8px;
  --radius: 12px;
  --radius-lg: 16px;
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
  --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.08), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
  --shadow-lg: 0 10px 25px -3px rgba(15, 23, 42, 0.12), 0 4px 6px -4px rgba(15, 23, 42, 0.07);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Inter', 'Noto Sans Devanagari', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background-color: var(--bg-page);
  color: var(--ink);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

button, input, select, textarea {
  font-family: inherit;
  font-size: 0.95rem;
}

/* Layout Shell */
.app-container {
  display: flex;
  min-height: 100vh;
}

/* SIDEBAR */
.sidebar {
  width: var(--sidebar-w);
  background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
  color: #f1f5f9;
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 0;
  height: 100vh;
  padding: 20px 14px;
  border-right: 1px solid rgba(255, 255, 255, 0.08);
  flex-shrink: 0;
  z-index: 50;
  transition: transform 0.25s ease;
}

.brand-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 6px 10px 20px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.1);
  margin-bottom: 16px;
}

.brand-badge {
  width: 42px;
  height: 42px;
  border-radius: 12px;
  background: linear-gradient(135deg, #3b82f6, #1d4ed8);
  color: #ffffff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 1.2rem;
  letter-spacing: -0.5px;
  box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
}

.brand-info h2 {
  font-size: 1.05rem;
  font-weight: 700;
  color: #ffffff;
  line-height: 1.2;
}

.brand-info span {
  font-size: 0.75rem;
  color: #94a3b8;
  font-weight: 500;
}

.user-badge {
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: var(--radius);
  padding: 10px 12px;
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 18px;
}

.user-avatar {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--accent);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 0.95rem;
  flex-shrink: 0;
}

.user-details {
  min-width: 0;
  flex: 1;
}

.user-role {
  font-size: 0.88rem;
  font-weight: 600;
  color: #ffffff;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.user-sub {
  font-size: 0.72rem;
  color: #94a3b8;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.nav-group {
  display: flex;
  flex-direction: column;
  gap: 4px;
  flex: 1;
  overflow-y: auto;
}

.nav-link {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 14px;
  color: #cbd5e1;
  border-radius: var(--radius-sm);
  background: transparent;
  border: none;
  width: 100%;
  text-align: left;
  cursor: pointer;
  font-size: 0.9rem;
  font-weight: 500;
  transition: all 0.15s ease;
}

.nav-link:hover {
  background: rgba(255, 255, 255, 0.08);
  color: #ffffff;
}

.nav-link.active {
  background: var(--primary-light);
  color: #ffffff;
  font-weight: 600;
  box-shadow: 0 4px 14px rgba(59, 130, 246, 0.35);
}

.nav-link .nav-icon {
  font-size: 1.15rem;
  width: 22px;
  text-align: center;
}

.nav-badge-count {
  margin-left: auto;
  font-size: 0.72rem;
  background: #ef4444;
  color: #ffffff;
  padding: 2px 7px;
  border-radius: 12px;
  font-weight: 700;
}

.sidebar-footer {
  border-top: 1px solid rgba(255, 255, 255, 0.1);
  padding-top: 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.logout-btn {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  background: rgba(239, 68, 68, 0.15);
  color: #fca5a5;
  border: 1px solid rgba(239, 68, 68, 0.2);
  width: 100%;
  cursor: pointer;
  font-size: 0.88rem;
  font-weight: 600;
  transition: all 0.15s;
}

.logout-btn:hover {
  background: rgba(239, 68, 68, 0.3);
  color: #ffffff;
}

.pwa-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 9px 12px;
  border-radius: var(--radius-sm);
  background: linear-gradient(135deg, #0d9488, #059669);
  color: #ffffff;
  border: none;
  font-size: 0.82rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.15s, box-shadow 0.15s;
}
.pwa-btn:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(13, 148, 136, 0.35);
}

/* MAIN CONTENT AREA */
.main-wrapper {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
}

/* TOPBAR */
.topbar {
  background: #ffffff;
  border-bottom: 1px solid var(--border);
  padding: 14px 28px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  position: sticky;
  top: 0;
  z-index: 40;
}

.topbar-title {
  display: flex;
  align-items: center;
  gap: 12px;
}

.mobile-toggle {
  display: none;
  background: none;
  border: 1px solid var(--border);
  padding: 6px 10px;
  border-radius: 8px;
  font-size: 1.2rem;
  cursor: pointer;
}

.topbar-title h1 {
  font-size: 1.3rem;
  font-weight: 800;
  color: var(--ink);
  letter-spacing: -0.5px;
}

.topbar-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}

.lang-switch {
  display: flex;
  background: var(--bg-page);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 2px;
}

.lang-btn {
  border: none;
  background: transparent;
  padding: 5px 12px;
  font-size: 0.8rem;
  font-weight: 700;
  border-radius: 16px;
  cursor: pointer;
  color: var(--ink-muted);
  transition: all 0.15s;
}

.lang-btn.active {
  background: var(--primary);
  color: white;
  box-shadow: 0 2px 6px rgba(30, 64, 175, 0.25);
}

.today-chip {
  background: var(--primary-soft);
  color: var(--primary);
  border: 1px solid #bfdbfe;
  font-size: 0.82rem;
  font-weight: 600;
  padding: 6px 14px;
  border-radius: 20px;
  display: flex;
  align-items: center;
  gap: 6px;
}

/* MAIN VIEW CONTAINER */
.content-body {
  padding: 24px 28px 60px;
  max-width: 1440px;
  width: 100%;
  margin: 0 auto;
}

/* KPI STATS ROW */
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 16px;
  margin-bottom: 24px;
}

.kpi-card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px 20px;
  box-shadow: var(--shadow-sm);
  display: flex;
  align-items: center;
  gap: 16px;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}

.kpi-card:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow);
}

.kpi-icon {
  width: 48px;
  height: 48px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.4rem;
  flex-shrink: 0;
}

.kpi-icon.blue { background: #dbeafe; color: #1d4ed8; }
.kpi-icon.green { background: #d1fae5; color: #047857; }
.kpi-icon.amber { background: #fef3c7; color: #b45309; }
.kpi-icon.purple { background: #ede9fe; color: #6d28d9; }

.kpi-content .kpi-val {
  font-size: 1.45rem;
  font-weight: 800;
  color: var(--ink);
  line-height: 1.2;
}

.kpi-content .kpi-label {
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--ink-muted);
  margin-top: 2px;
}

/* CARDS & PANELS */
.panel-card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 22px 24px;
  box-shadow: var(--shadow-sm);
  margin-bottom: 24px;
}

.panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 14px;
  margin-bottom: 18px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--border);
}

.panel-header h2 {
  font-size: 1.18rem;
  font-weight: 700;
  color: var(--ink);
}

.panel-header p {
  font-size: 0.85rem;
  color: var(--ink-muted);
  margin-top: 2px;
}

.panel-toolbar {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

/* BUTTONS */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 8px 16px;
  border-radius: var(--radius-sm);
  font-weight: 600;
  font-size: 0.88rem;
  cursor: pointer;
  transition: all 0.15s ease;
  border: 1px solid transparent;
  text-decoration: none;
}

.btn:active { transform: scale(0.98); }
.btn-primary { background: var(--primary); color: #ffffff; }
.btn-primary:hover { background: var(--primary-dark); }
.btn-accent { background: var(--accent); color: #ffffff; }
.btn-accent:hover { background: #0f766e; }
.btn-success { background: var(--c-present); color: #ffffff; }
.btn-success:hover { background: #059669; }
.btn-outline { background: #ffffff; border-color: var(--border); color: var(--ink); }
.btn-outline:hover { background: var(--bg-page); border-color: #cbd5e1; }
.btn-danger { background: #fee2e2; color: #b91c1c; border-color: #fca5a5; }
.btn-danger:hover { background: #ef4444; color: #ffffff; }
.btn-sm { padding: 5px 10px; font-size: 0.8rem; }
.btn-icon { padding: 6px 8px; border-radius: 6px; }

/* FORMS */
.form-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 14px;
  margin-bottom: 16px;
}

.form-field {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.form-field label {
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--ink-muted);
}

.form-field input, .form-field select, .form-field textarea {
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: #ffffff;
  color: var(--ink);
  transition: border-color 0.15s, box-shadow 0.15s;
}

.form-field input:focus, .form-field select:focus, .form-field textarea:focus {
  border-color: var(--primary-light);
  outline: none;
  box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
}

/* TABLES */
.table-responsive {
  overflow-x: auto;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: #ffffff;
}

table.data-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.88rem;
  text-align: left;
}

table.data-table th {
  background: #f1f5f9;
  color: var(--ink-muted);
  font-weight: 700;
  font-size: 0.78rem;
  text-transform: uppercase;
  letter-spacing: 0.03em;
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}

table.data-table td {
  padding: 11px 12px;
  border-bottom: 1px solid var(--border);
  color: var(--ink);
  vertical-align: middle;
}

table.data-table tbody tr:hover {
  background-color: #f8fafc;
}

table.data-table td.num, table.data-table th.num {
  text-align: right;
  font-variant-numeric: tabular-nums;
}

/* STATUS BADGES & PILLS */
.status-pill-group {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
}

.status-btn {
  padding: 5px 10px;
  border-radius: 20px;
  font-size: 0.76rem;
  font-weight: 700;
  border: 1.5px solid var(--border);
  background: #ffffff;
  color: var(--ink-muted);
  cursor: pointer;
  user-select: none;
  transition: all 0.12s;
}

.status-btn:hover {
  transform: translateY(-1px);
}

.status-btn.disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

.status-btn.selected-P { background: var(--c-present); border-color: var(--c-present); color: #ffffff; }
.status-btn.selected-A { background: var(--c-absent); border-color: var(--c-absent); color: #ffffff; }
.status-btn.selected-H { background: var(--c-half); border-color: var(--c-half); color: #ffffff; }
.status-btn.selected-CL { background: var(--c-cl); border-color: var(--c-cl); color: #ffffff; }
.status-btn.selected-WO { background: var(--c-wo); border-color: var(--c-wo); color: #ffffff; }
.status-btn.selected-HL { background: var(--c-hl); border-color: var(--c-hl); color: #ffffff; }

.badge {
  display: inline-flex;
  align-items: center;
  padding: 3px 8px;
  border-radius: 6px;
  font-size: 0.74rem;
  font-weight: 700;
  white-space: nowrap;
}

.badge-P { background: var(--c-present-bg); color: var(--c-present-text); border: 1px solid #a7f3d0; }
.badge-A { background: var(--c-absent-bg); color: var(--c-absent-text); border: 1px solid #fecaca; }
.badge-H { background: var(--c-half-bg); color: var(--c-half-text); border: 1px solid #fde68a; }
.badge-CL { background: var(--c-cl-bg); color: var(--c-cl-text); border: 1px solid #bfdbfe; }
.badge-WO { background: var(--c-wo-bg); color: var(--c-wo-text); border: 1px solid #ddd6fe; }
.badge-HL { background: var(--c-hl-bg); color: var(--c-hl-text); border: 1px solid #fbcfe8; }
.badge-gray { background: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; }

/* MUSTER ROLL GRID */
.muster-table {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
  font-size: 0.75rem;
}

.muster-table th, .muster-table td {
  padding: 6px 3px;
  text-align: center;
  border: 1px solid var(--border);
  min-width: 25px;
}

.muster-table th.emp-col, .muster-table td.emp-col {
  text-align: left;
  position: sticky;
  left: 0;
  background: #ffffff;
  z-index: 10;
  min-width: 150px;
  padding-left: 10px;
}

.muster-table th.emp-col { background: #f8fafc; }

.muster-table th.sun-col, .muster-table td.sun-col {
  background-color: #fff1f2;
}

.muster-cell-btn {
  width: 23px;
  height: 23px;
  border-radius: 4px;
  border: none;
  font-size: 0.7rem;
  font-weight: 700;
  cursor: pointer;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.1s;
}

.muster-cell-btn:hover { transform: scale(1.15); }
.m-P { background: var(--c-present); color: #fff; }
.m-A { background: var(--c-absent); color: #fff; }
.m-H { background: var(--c-half); color: #fff; }
.m-CL { background: var(--c-cl); color: #fff; }
.m-WO { background: var(--c-wo); color: #fff; }
.m-HL { background: var(--c-hl); color: #fff; }
.m-NM { background: #e2e8f0; color: #64748b; }

/* CLEAN PRESENTEE SHEET (PDF / PRINT ONLY) */
.presentee-sheet-container {
  background: #ffffff;
  padding: 24px;
  border-radius: 8px;
  border: 1px solid var(--border);
}

.ps-header {
  text-align: center;
  padding-bottom: 16px;
  border-bottom: 2px solid #0f172a;
  margin-bottom: 18px;
}

.ps-header h1 {
  font-size: 1.6rem;
  font-weight: 800;
  color: #0f172a;
  letter-spacing: 0.5px;
}

.ps-header h2 {
  font-size: 1.05rem;
  font-weight: 700;
  color: #334155;
  margin-top: 2px;
}

.ps-meta-banner {
  display: flex;
  justify-content: space-between;
  background: #f8fafc;
  border: 1px solid #cbd5e1;
  padding: 8px 14px;
  border-radius: 4px;
  margin-bottom: 16px;
  font-size: 0.88rem;
  font-weight: 600;
}

.ps-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.82rem;
  text-align: left;
}

.ps-table th, .ps-table td {
  border: 1px solid #64748b;
  padding: 8px 10px;
}

.ps-table th {
  background: #f1f5f9;
  color: #0f172a;
  font-weight: 800;
  text-align: center;
}

.ps-table td.center { text-align: center; }
.ps-table td.num { text-align: right; font-weight: 600; }
.ps-table td.highlight { background: #f8fafc; font-weight: 800; text-align: right; color: #0f172a; }

.ps-footer-signs {
  display: flex;
  justify-content: space-between;
  margin-top: 50px;
  padding-top: 10px;
}

.ps-sign-box {
  width: 200px;
  text-align: center;
  border-top: 1.5px solid #334155;
  padding-top: 6px;
  font-size: 0.8rem;
  font-weight: 600;
  color: #334155;
}

/* DATE LOCK SECURITY BADGE */
.date-lock-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 12px;
  border-radius: 20px;
  font-size: 0.78rem;
  font-weight: 700;
}

.date-lock-pill.locked {
  background: #fef2f2;
  border: 1px solid #fca5a5;
  color: #991b1b;
}

.date-lock-pill.unlocked {
  background: #ecfdf5;
  border: 1px solid #a7f3d0;
  color: #065f46;
}

/* TOAST NOTIFICATION */
#toastContainer {
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 9999;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.toast-msg {
  background: #1e293b;
  color: #ffffff;
  padding: 12px 18px;
  border-radius: var(--radius-sm);
  box-shadow: var(--shadow-lg);
  font-size: 0.88rem;
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 10px;

<!-- Toast Container -->

<!-- Modal Container -->

  <div class="modal-dialog" id="modalDialog">

    <div id="modalContent"></div>

<script>
/* ============================================================
   VEDANT ENTERPRISES ATTENDANCE & PAYROLL ENGINE (20th TO 19th CYCLE)
   ============================================================ */

const APP_STORAGE_KEY = 'vedant_attendance_data_v3';
const APP_REMEMBER_KEY = 'vedant_remembered_session_v3';

const MONTHS_MR = ['जानेवारी','फेब्रुवारी','मार्च','एप्रिल','मे','जून','जुलै','ऑगस्ट','सप्टेंबर','ऑक्टोबर','नोव्हेंबर','डिसेंबर'];
const MONTHS_EN = ['January','February','March','April','May','June','July','August','September','October','November','December'];

// Standard Designations
const POSTS_LIST = [
  'Branch Manager',
  'Accountant',
  'Parts Manager',
  'Parts Executive',
  'Sales Executive',
  'Deputy Warranty Manager',
  'Technical Advisor',
  'Service Advisor (SA)',
  'Mechanic',
  'SAP Operator',
  'Back Office Executive',
  'Helper',
  'Works Manager',
  'Customer Relationship Executive (CRE)',
  'Auto Electrician',
  'HouseKeeping'
];

const MASTER_ADMIN_DEFAULT_PASS = 'admin123';

/* ---------------- 20th TO 19th CYCLE UTILITIES ---------------- */
function getDatesInCycle(startDateStr, endDateStr) {
  const dates = [];
  let cur = new Date(startDateStr + 'T00:00:00');
  const end = new Date(endDateStr + 'T00:00:00');
  while (cur <= end) {
    const y = cur.getFullYear();
    const m = String(cur.getMonth() + 1).padStart(2, '0');
    const d = String(cur.getDate()).padStart(2, '0');
    dates.push(`${y}-${m}-${d}`);
    cur.setDate(cur.getDate() + 1);
  }
  return dates;
}

// Generate 20th-to-19th cycles (e.g. 20 Aug to 19 Sep, 20 Sep to 19 Oct)
function getAvailableCycles() {
  const list = [];
  const now = new Date();
  const baseYear = now.getFullYear();

  for (let offset = -4; offset <= 4; offset++) {
    const sDate = new Date(baseYear, now.getMonth() + offset, 20);
    const eDate = new Date(baseYear, now.getMonth() + offset + 1, 19);

    const sY = sDate.getFullYear();
    const sM = String(sDate.getMonth() + 1).padStart(2, '0');
    const eY = eDate.getFullYear();
    const eM = String(eDate.getMonth() + 1).padStart(2, '0');

    const startStr = `${sY}-${sM}-20`;
    const endStr = `${eY}-${eM}-19`;

    const labelMr = `20 ${MONTHS_MR[sDate.getMonth()]} ते 19 ${MONTHS_MR[eDate.getMonth()]} ${eY}`;
    const labelEn = `20 ${MONTHS_EN[sDate.getMonth()]} to 19 ${MONTHS_EN[eDate.getMonth()]} ${eY}`;

    list.push({
      id: `${startStr}|${endStr}`,
      start: startStr,
      end: endStr,
      label: currentLang === 'mr' ? labelMr : labelEn
    });
  }
  return list;
}

function getDefaultCycleId() {
  const now = new Date();
  const day = now.getDate();
  const m = now.getMonth();
  const y = now.getFullYear();

  let sDate, eDate;
  if (day >= 20) {
    sDate = new Date(y, m, 20);
    eDate = new Date(y, m + 1, 19);
  } else {
    sDate = new Date(y, m - 1, 20);
    eDate = new Date(y, m, 19);
  }

  const sY = sDate.getFullYear();
  const sM = String(sDate.getMonth() + 1).padStart(2, '0');
  const eY = eDate.getFullYear();
  const eM = String(eDate.getMonth() + 1).padStart(2, '0');

  return `${sY}-${sM}-20|${eY}-${eM}-19`;
}

function parseCycleId(cycleId) {
  if (!cycleId || !cycleId.includes('|')) cycleId = getDefaultCycleId();
  const [start, end] = cycleId.split('|');
  const [sY, sM] = start.split('-').map(Number);
  const [eY, eM] = end.split('-').map(Number);
  const labelMr = `20 ${MONTHS_MR[sM - 1]} ते 19 ${MONTHS_MR[eM - 1]} ${eY}`;
  const labelEn = `20 ${MONTHS_EN[sM - 1]} to 19 ${MONTHS_EN[eM - 1]} ${eY}`;

  return {
    id: cycleId,
    start,
    end,
    label: currentLang === 'mr' ? labelMr : labelEn,
    dates: getDatesInCycle(start, end)
  };
}

// Default Data Factory (Dharashiv changed to Umarga, employees empty by default)
function createDefaultData() {
  const defaultBranches = [
    { id: 'b1', name: 'शाखा १ (लातूर)', district: 'लातूर (Latur)', password: 'branch1' },
    { id: 'b2', name: 'शाखा २ (नांदेड)', district: 'नांदेड (Nanded)', password: 'branch2' },
    { id: 'b3', name: 'शाखा ३ (उमरगा)', district: 'उमरगा (Umarga)', password: 'branch3' },
    { id: 'b4', name: 'शाखा ४ (बीड)', district: 'बीड (Beed)', password: 'branch4' },
    { id: 'b5', name: 'शाखा ५ (सोलापूर)', district: 'सोलापूर (Solapur)', password: 'branch5' }
  ];

  return {
    version: 4,
    mainAdminPassword: MASTER_ADMIN_DEFAULT_PASS,
    branches: defaultBranches,
    employees: [], // empty as requested
    attendance: {},
    advances: [],
    dateChangeApprovals: {},
    dateChangeRequests: [],
    settings: {
      clAllowedPerMonth: 1,
      workingDaysMode: 'calendar',
      paidWeeklyOff: true,
      paidHolidays: true,
      ptEnabled: true,
      esicRatePercent: 0
    }
  };
}

// Global App State
let DATA = null;
let session = null;
let currentLang = 'mr';

let uiState = {
  currentTab: 'daily',
  selectedDate: todayStr(),
  selectedCycleId: getDefaultCycleId(),
  filterPost: '',
  searchQuery: '',
  viewSlipEmpId: null,
  mobileSidebarOpen: false,
  sessionDateUnlocked: false,
  mainViewingBranchId: null, // When main admin clicks a branch to view its reports
  mainIndivEmpId: null       // When main admin views an individual employee report
};

function todayStr() {
  const d = new Date();
  return d.toISOString().slice(0, 10);
}

function getDayOfWeek(dateStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  return new Date(y, m - 1, d).getDay();
}

function attnKey(empId, date) {
  return `${empId}|${date}`;
}

function uid() {
  return 'id_' + Math.random().toString(36).substr(2, 9);
}

function esc(str) {
  return String(str == null ? '' : str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function formatCurrency(val) {
  return '₹' + Number(val || 0).toLocaleString('en-IN');
}

function numberToWordsMarathi(num) {
  num = Math.round(Number(num) || 0);
  if (num === 0) return 'रुपये शून्य फक्त';
  return `रुपये ${num.toLocaleString('en-IN')} फक्त`;
}

function numberToWordsEnglish(num) {
  num = Math.round(Number(num) || 0);
  if (num === 0) return 'Rupees Zero Only';
  return `Rupees ${num.toLocaleString('en-IN')} Only`;
}

/* ---------------- LOCAL PERSISTENCE ---------------- */
function loadLocalData() {
  try {
    const raw = localStorage.getItem(APP_STORAGE_KEY);
    if (raw) {
      DATA = JSON.parse(raw);
    }
  } catch (e) {}

  if (!DATA || !DATA.branches || DATA.branches.length === 0) {
    DATA = createDefaultData();
    saveDataLocal();
  }

  // Automatic Migration: rename any Dharashiv to Umarga
  if (DATA && DATA.branches) {
    DATA.branches.forEach(b => {
      if (b.name && (b.name.includes('धाराशिव') || b.name.includes('Dharashiv'))) {
        b.name = 'शाखा ३ (उमरगा)';
        b.district = 'उमरगा (Umarga)';
      }
      if (b.district && (b.district.includes('धाराशिव') || b.district.includes('Dharashiv'))) {
        b.district = 'उमरगा (Umarga)';
      }
    });
  }

  if (!DATA.dateChangeApprovals) DATA.dateChangeApprovals = {};
  if (!DATA.dateChangeRequests) DATA.dateChangeRequests = [];
  if (!DATA.employees) DATA.employees = [];
  if (!DATA.advances) DATA.advances = [];
  if (!DATA.attendance) DATA.attendance = {};
}

function saveDataLocal() {
  try {
    localStorage.setItem(APP_STORAGE_KEY, JSON.stringify(DATA));
  } catch (e) {}
}

async function persist() {
  saveDataLocal();
  if (typeof SyncEngine !== 'undefined') {
    await SyncEngine.pushUpdate(DATA);
  }
}

/* ---------------- DATE APPROVAL GATE ---------------- */
function isDateAllowedForMarking(branchId, dateStr) {
  if (session && session.role === 'main') return true;
  if (dateStr === todayStr()) return true;
  if (uiState.sessionDateUnlocked) return true;

  const key = `${branchId}|${dateStr}`;
  if (DATA.dateChangeApprovals && DATA.dateChangeApprovals[key] && DATA.dateChangeApprovals[key].status === 'approved') {
    return true;
  }
  return false;
}

/* ---------------- ADVANCE & PT CALCULATIONS ---------------- */
function calculateMaharashtraPT(salary, ym, isExempt) {
  if (isExempt) return 0;
  const sal = Number(salary) || 0;
  if (sal <= 7500) return 0;
  if (sal <= 10000) return 175;
  const month = Number(ym.split('-')[1]);
  return month === 2 ? 300 : 200;
}

function deductionForCycle(adv, cycle) {
  const monthly = Number(adv.monthlyDeduction) || Number(adv.amount);
  if (adv.date > cycle.end) return 0;
  const advMonthIdx = (new Date(adv.date).getFullYear() * 12) + new Date(adv.date).getMonth();
  const cycleMonthIdx = (new Date(cycle.start).getFullYear() * 12) + new Date(cycle.start).getMonth();
  const elapsed = cycleMonthIdx - advMonthIdx;
  if (elapsed < 0) return 0;
  const deductedBefore = elapsed * monthly;
  const remainingBefore = Number(adv.amount) - deductedBefore;
  if (remainingBefore <= 0) return 0;
  return Math.min(monthly, remainingBefore);
}

function advanceRemainingForCycle(adv, cycle) {
  const monthly = Number(adv.monthlyDeduction) || Number(adv.amount);
  const advMonthIdx = (new Date(adv.date).getFullYear() * 12) + new Date(adv.date).getMonth();
  const cycleMonthIdx = (new Date(cycle.start).getFullYear() * 12) + new Date(cycle.start).getMonth();
  const elapsed = cycleMonthIdx - advMonthIdx + 1;
  if (elapsed <= 0) return Number(adv.amount);
  const deducted = Math.min(Number(adv.amount), elapsed * monthly);
  return Math.max(0, Number(adv.amount) - deducted);
}

/* ---------------- 20th-TO-19th SALARY STATS ---------------- */
function getEmpCycleStats(emp, cycle) {
  const dates = cycle.dates;
  const totalDaysInCycle = dates.length;

  let P = 0, A = 0, H = 0, CL = 0, WO = 0, HL = 0, NM = 0;

  dates.forEach(dStr => {
    const st = DATA.attendance[attnKey(emp.id, dStr)];
    if (st === 'P') P++;
    else if (st === 'A') A++;
    else if (st === 'H') H++;
    else if (st === 'CL') CL++;
    else if (st === 'WO') WO++;
    else if (st === 'HL') HL++;
    else NM++;
  });

  const clAllowed = DATA.settings.clAllowedPerMonth ?? 1;
  const paidCL = Math.min(CL, clAllowed);
  const unpaidCL = CL - paidCL;

  const paidWO = DATA.settings.paidWeeklyOff ? WO : 0;
  const paidHL = DATA.settings.paidHolidays ? HL : 0;

  const payableDays = P + (H * 0.5) + paidCL + paidWO + paidHL;

  const perDaySalary = (Number(emp.salary) || 0) / totalDaysInCycle;
  const earnedBasic = Math.round(perDaySalary * payableDays);

  const hra = Number(emp.hra) || 0;
  const otherAllowance = Number(emp.otherAllowance) || 0;
  const grossSalary = earnedBasic + hra + otherAllowance;

  const empAdvs = DATA.advances.filter(a => a.empId === emp.id);
  const advanceDeduction = empAdvs.reduce((s, a) => s + deductionForCycle(a, cycle), 0);

  let pfDeduction = 0;
  const pfPercent = Number(emp.pfPercent) || 0;
  const pfManual = Number(emp.pfManualAmount) || 0;
  if (pfPercent > 0 && earnedBasic > 0) {
    pfDeduction = Math.round(earnedBasic * (pfPercent / 100));
  } else if (pfManual > 0 && earnedBasic > 0) {
    pfDeduction = Math.round(pfManual);
  }

  let ptDeduction = 0;
  if (DATA.settings.ptEnabled && earnedBasic > 0) {
    ptDeduction = calculateMaharashtraPT(emp.salary, cycle.end.slice(0, 7), emp.ptExempt);
  }

  const totalDeductions = advanceDeduction + pfDeduction + ptDeduction;
  const netPayable = Math.max(0, grossSalary - totalDeductions);
  const attPercent = totalDaysInCycle > 0 ? Math.round((payableDays / totalDaysInCycle) * 100) : 0;

  return {
    totalDaysInCycle,
    P, A, H, CL, WO, HL, NM,
    paidCL, unpaidCL,
    paidWO, paidHL,
    payableDays,
    perDaySalary,
    earnedBasic,
    hra,
    otherAllowance,
    grossSalary,
    advanceDeduction,
    pfDeduction,
    ptDeduction,
    totalDeductions,
    netPayable,
    attPercent
  };
}

          <span>${typeof SyncEngine !== 'undefined' && SyncEngine.lastSyncTime ? SyncEngine.lastSyncTime.toLocaleTimeString() : (isMr ? 'आत्ता' : 'Just now')}</span>
        </div>
      </div>

      <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap;">

      </div>

}

async function handleManualSyncPull() {
  if (typeof SyncEngine !== 'undefined') {
    showToast(currentLang === 'mr' ? 'क्लाउडवरून सिंक सुरू आहे...' : 'Syncing with cloud...', 'info');
    if (DATA) {
      await SyncEngine.pushUpdate(DATA);
    }
  }
  closeModal();
}

function switchLang(l) {
  currentLang = l;
  renderApp();
}

/* ---------------- ACTIVE VIEW ROUTER ---------------- */
function renderActiveView() {
  const cycle = parseCycleId(uiState.selectedCycleId);

  if (session.role === 'branch') {
    const branch = DATA.branches.find(b => b.id === session.branchId);
    const emps = DATA.employees.filter(e => e.branchId === branch.id);

    return `
      ${renderBranchKpis(branch, emps, cycle)}
      ${uiState.currentTab === 'daily' ? renderDailyAttendanceView(branch, emps) : ''}
      ${uiState.currentTab === 'muster' ? renderMusterRollView(branch, emps, cycle) : ''}
      ${uiState.currentTab === 'presenteePdf' ? renderCleanPresenteePdfView(branch, emps, cycle) : ''}
      ${uiState.currentTab === 'employees' ? renderEmployeesView(branch, emps) : ''}
      ${uiState.currentTab === 'payroll' ? renderPayrollReportView(branch, emps, cycle) : ''}
      ${uiState.currentTab === 'slips' ? renderSlipsView(branch, emps, cycle) : ''}
      ${uiState.currentTab === 'advances' ? renderAdvancesView(branch, emps, cycle) : ''}
    `;
  } else {
    // Main Admin View: If viewing a branch's reports, render branch report view
    if (uiState.mainViewingBranchId) {
      return renderAdminBranchReportView(uiState.mainViewingBranchId, cycle);
    }

    return `
      ${renderMainKpis(cycle)}
      ${uiState.currentTab === 'overview' ? renderMainOverviewView() : ''}
      ${uiState.currentTab === 'approvals' ? renderMainApprovalsView() : ''}
      ${uiState.currentTab === 'consolidated' ? renderMainConsolidatedPayroll(cycle) : ''}
      ${uiState.currentTab === 'allAdvances' ? renderMainAllAdvances(cycle) : ''}
      ${uiState.currentTab === 'branches' ? renderMainBranchManagement() : ''}
      ${uiState.currentTab === 'settings' ? renderMainSettingsView() : ''}
    `;
  }
}

function renderBranchKpis(branch, emps, cycle) {
  const today = todayStr();
  const isMr = (currentLang === 'mr');
  let todayMarked = 0, totalAdvCycle = 0, totalNetCycle = 0;

  emps.forEach(e => {
    if (DATA.attendance[attnKey(e.id, today)]) todayMarked++;
    const stats = getEmpCycleStats(e, cycle);
    totalAdvCycle += stats.advanceDeduction;
    totalNetCycle += stats.netPayable;
  });

  return `
    <div class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-icon blue">👥</div>
        <div class="kpi-content">
          <div class="kpi-val">${emps.length}</div>
          <div class="kpi-label">${isMr ? 'शाखा कर्मचारी' : 'Branch Staff'}</div>
        </div>
      </div>

      <div class="kpi-card">
        <div class="kpi-icon green">✅</div>
        <div class="kpi-content">
          <div class="kpi-val">${todayMarked} / ${emps.length}</div>
          <div class="kpi-label">${isMr ? 'आजची हजेरी नोंद' : 'Today Marked'}</div>
        </div>
      </div>

      <div class="kpi-card">
        <div class="kpi-icon amber">💰</div>
        <div class="kpi-content">
          <div class="kpi-val">${formatCurrency(totalAdvCycle)}</div>
          <div class="kpi-label">${isMr ? 'ॲडव्हान्स कपात' : 'Advance EMI'}</div>
        </div>
      </div>

      <div class="kpi-card">
        <div class="kpi-icon purple">🏦</div>
        <div class="kpi-content">
          <div class="kpi-val">${formatCurrency(totalNetCycle)}</div>
          <div class="kpi-label">${isMr ? 'एकूण निव्वळ वेतन (२०-१९)' : 'Total Net Payroll'}</div>
        </div>
      </div>
    </div>
  `;
}

          </button>

      ` : ''}

      ${isSunday ? `

          🌴 <b>${isMr ? 'आज रविवार (साप्ताहिक सुट्टी) आहे.' : 'Today is Sunday (Weekly Off).'}</b>

        </div>

          <select onchange="updatePostFilter(this.value)">
            <option value="">${isMr ? '-- सर्व पदे --' : '-- All Designations --'}</option>

      <div class="desktop-table-container table-responsive">

function changeDailyDatePrompt(branchId, newDate) {
  uiState.selectedDate = newDate;
  const isAllowed = isDateAllowedForMarking(branchId, newDate);
  if (!isAllowed) {
    openRequestApprovalModal(branchId, newDate);
  }
  renderApp();
}

function handleStatusClick(empId, date, code, isAllowed) {
  if (!isAllowed) {
    openRequestApprovalModal(session.branchId, date);
    return;
  }
  setAttendanceStatus(empId, date, code);
}

async function setAttendanceStatus(empId, date, code) {
  DATA.attendance[attnKey(empId, date)] = code;
  await persist();
  showToast(`${date}: ${code}`, 'success');
  renderApp();
}

async function bulkMarkStatus(code) {
  const branch = DATA.branches.find(b => b.id === session.branchId);
  const emps = DATA.employees.filter(e => e.branchId === branch.id);
  const curDate = uiState.selectedDate;

  if (!isDateAllowedForMarking(branch.id, curDate)) {
    openRequestApprovalModal(branch.id, curDate);
    return;
  }

  emps.forEach(e => {
    DATA.attendance[attnKey(e.id, curDate)] = code;
  });

  await persist();
  showToast(`सर्व कर्मचाऱ्यांना '${code}' नोंदवले गेले!`, 'success');
  renderApp();
}

function updateSearch(q) {
  uiState.searchQuery = q;
  renderApp();
}

function updatePostFilter(p) {
  uiState.filterPost = p;
  renderApp();
}

function openRequestApprovalModal(branchId, targetDate) {

    <h3 style="margin-bottom:14px;color:var(--primary);font-weight:800;">
      🔐 ${isMr ? 'हजेरी तारीख बदल मंजुरी' : 'Admin Approval Required'}
    </h3>
    <p style="font-size:0.85rem;color:var(--ink-muted);margin-bottom:16px;">
      ${isMr ? `तारीख <b>${targetDate}</b> ही मागील तारीख असल्याने बदल करण्यासाठी मुख्य ऍडमिनची मंजुरी आवश्यक आहे:`
             : `Date <b>${targetDate}</b> is in the past. To modify, please authorize via one of the options below:`}

    <div style="background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;padding:14px;margin-bottom:16px;">

        ${isMr ? 'पर्याय १: मुख्य ऍडमिन पासवर्डने त्वरित अनलॉक करा' : 'Option 1: Quick Unlock via Master Password'}
      </h4>
      <div class="form-field">
        <label>${isMr ? 'मुख्य ऍडमिन पासवर्ड (Master Password):' : 'Master Password:'}</label>
        <input type="password" id="masterPassQuickUnlock" placeholder="Enter password">
      </div>
      <button class="btn btn-primary btn-sm" style="margin-top:10px;" onclick="handleMasterPassUnlock('${targetDate}')">
        🔓 ${isMr ? 'त्वरित अनलॉक करा' : 'Unlock Now'}
      </button>
    </div>

    <div style="background:#f8fafc;border:1px solid var(--border);border-radius:8px;padding:14px;">
      <h4 style="font-size:0.9rem;color:var(--ink);margin-bottom:8px;">
        ${isMr ? 'पर्याय २: मुख्य ऍडमिनकडे मंजुरी विनंती पाठवा' : 'Option 2: Submit Approval Request to Admin'}
      </h4>
      <div class="form-field">
        <label>${isMr ? 'कारण (Reason):' : 'Reason:'}</label>
        <input type="text" id="reqApprovalReason" placeholder="${isMr ? 'उदा. काल हजेरी राहिली होती' : 'e.g. Backdated entry required'}">
      </div>
      <button class="btn btn-outline btn-sm" style="margin-top:10px;" onclick="handleSubmitApprovalRequest('${branchId}', '${targetDate}')">
        📩 ${isMr ? 'विनंती पाठवा' : 'Send Request'}
      </button>
    </div>

    <div style="display:flex;justify-content:flex-end;margin-top:16px;">
      <button class="btn btn-outline" onclick="closeModal()">${isMr ? 'बंद करा' : 'Close'}</button>
    </div>
  `;
  openModal(html);
}

function handleMasterPassUnlock(targetDate) {
  const entered = document.getElementById('masterPassQuickUnlock').value.trim();
  const correct = DATA.mainAdminPassword || MASTER_ADMIN_DEFAULT_PASS;
  if (entered === correct) {
    uiState.sessionDateUnlocked = true;
    closeModal();
    showToast(`तारीख ${targetDate} अनलॉक झाली!`, 'success');
    renderApp();
  } else {
    alert(currentLang === 'mr' ? 'चुकीचा मुख्य ऍडमिन पासवर्ड!' : 'Invalid Master Password!');
  }
}

async function handleSubmitApprovalRequest(branchId, dateStr) {
  const reason = document.getElementById('reqApprovalReason').value.trim() || 'तारीख बदल आवश्यक';
  const branch = DATA.branches.find(b => b.id === branchId);

  DATA.dateChangeRequests.push({
    id: uid(),
    branchId,
    branchName: branch ? branch.name : 'शाखा',
    date: dateStr,
    reason,
    requestedAt: new Date().toISOString(),
    status: 'pending'
  });

  await persist();
  closeModal();
  showToast('मंजुरी विनंती पाठवली गेली!', 'success');
  renderApp();
}

        <div class="panel-toolbar">
          <div class="form-field" style="flex-direction:row;align-items:center;gap:8px;">

            <select onchange="changeCycle(this.value)">
              ${cycleSelectOpts}

          <button class="btn btn-outline btn-sm" onclick="exportMusterExcelOnly('${branch.id}', '${cycle.id}')">
            📥 ${isMr ? 'मस्टर रोल Excel (Muster Only)' : 'Export Muster Excel'}
          </button>
          <button class="btn btn-primary btn-sm" onclick="switchTab('presenteePdf')">
            📄 ${isMr ? 'उपस्थिती पत्रक (PDF View)' : 'Presentee Sheet (PDF)'}
          </button>
        </div>
      </div>

      <div style="display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;font-size:0.8rem;align-items:center;">
        <b>${isMr ? 'खूण' : 'Legend'}:</b>
        <span class="badge badge-P">P: ${isMr ? 'हजर' : 'Present'}</span>
        <span class="badge badge-A">A: ${isMr ? 'गैरहजर' : 'Absent'}</span>

async function cycleMusterStatus(empId, dateStr, branchId) {
  if (!isDateAllowedForMarking(branchId, dateStr)) {
    openRequestApprovalModal(branchId, dateStr);
    return;
  }

  const sequence = ['P', 'A', 'H', 'CL', 'WO', 'HL', 'NM'];
  const cur = DATA.attendance[attnKey(empId, dateStr)] || 'NM';
  const idx = sequence.indexOf(cur);
  const next = sequence[(idx + 1) % sequence.length];

  if (next === 'NM') {
    delete DATA.attendance[attnKey(empId, dateStr)];
  } else {
    DATA.attendance[attnKey(empId, dateStr)] = next;
  }

  await persist();
  renderApp();
}

/* EXPORT MUSTER TO EXCEL (ONLY THE MUSTER ROLL - NO SALARY COLUMNS) */
function exportMusterExcelOnly(branchId, cycleId) {
  const branch = DATA.branches.find(b => b.id === branchId);
  const emps = DATA.employees.filter(e => e.branchId === branchId);
  const cycle = parseCycleId(cycleId);

  let csv = `VEDANT ENTERPRISES - कर्मचारी उपस्थिती मस्टर रोल (MUSTER ROLL ONLY)\n`;
  csv += `शाखा:,"${branch.name} (${branch.district})"\n`;
  csv += `कालावधी:,"${cycle.start} ते ${cycle.end} (२० तारखेपासून १९ तारखेपर्यंत)"\n`;
  csv += `एकूण दिवस:,"${cycle.dates.length}"\n\n`;

  csv += 'अ.क्र.,कर्मचाऱ्याचे नाव,पद,शाखा';
  cycle.dates.forEach(dStr => {
    const dow = ['रवि','सोम','मंगळ','बुध','गुरु','शुक्र','शनि'][getDayOfWeek(dStr)];
    const day = dStr.split('-')[2];
    csv += `,"${day} (${dow})"`;
  });
  csv += ',एकूण हजर (P),एकूण गैरहजर (A),हाफ डे (H),सी.एल. (CL),साप्ताहिक सुट्टी (WO),सण (HL),एकूण देय उपस्थिती दिवस\n';

  emps.forEach((e, idx) => {
    const stats = getEmpCycleStats(e, cycle);
    csv += `${idx + 1},"${e.name}","${e.post || ''}","${branch.name}"`;

    cycle.dates.forEach(dStr => {
      const st = DATA.attendance[attnKey(e.id, dStr)] || '-';
      csv += `,"${st}"`;
    });

    csv += `,${stats.P},${stats.A},${stats.H},${stats.CL},${stats.WO},${stats.HL},${stats.payableDays}\n`;
  });

  const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${branch.name}_मस्टर_रोल_${cycle.start}_ते_${cycle.end}.csv`;
  a.click();
  showToast('मस्टर रोल Excel फाईल डाऊनलोड झाली!', 'success');
}

// Check that no single employee exists in two branches
function checkDuplicateEmployeeAcrossBranches(name, phone, accNo, ignoreEmpId = null) {
  const normName = name.trim().toLowerCase();
  const normPhone = (phone || '').trim();
  const normAcc = (accNo || '').trim();

  return DATA.employees.find(e => {
    if (ignoreEmpId && e.id === ignoreEmpId) return false;
    const sameName = e.name.trim().toLowerCase() === normName;
    const samePhone = normPhone && e.phone && e.phone.trim() === normPhone;
    const sameAcc = normAcc && e.accNo && e.accNo.trim() === normAcc;
    return sameName || samePhone || sameAcc;
  });
}

async function handleSaveNewEmployee(e) {
  e.preventDefault();
  const name = document.getElementById('newEmpName').value.trim();
  const salary = Number(document.getElementById('newEmpSalary').value);
  const post = document.getElementById('newEmpPost').value;
  const phone = document.getElementById('newEmpPhone').value.trim();
  const bankName = document.getElementById('newEmpBank').value.trim();
  const accNo = document.getElementById('newEmpAcc').value.trim();
  const ifsc = document.getElementById('newEmpIfsc').value.trim().toUpperCase();
  const pfPercent = Number(document.getElementById('newEmpPfPercent').value) || 0;
  const pfManualAmount = Number(document.getElementById('newEmpPfManual').value) || 0;
  const ptExempt = document.getElementById('newEmpPtExempt').checked;

  // Strict check: No employee can be in two branches
  const duplicate = checkDuplicateEmployeeAcrossBranches(name, phone, accNo);
  if (duplicate) {
    const exBranch = DATA.branches.find(b => b.id === duplicate.branchId);
    const bName = exBranch ? exBranch.name : 'दुसऱ्या';
    alert(`❌ त्रुटी: "${duplicate.name}" हे कर्मचारी आधीच '${bName}' शाखेत नोंदणीकृत आहेत!\nएका कर्मचाऱ्याची दोन शाखांमध्ये नोंद करता येत नाही.`);
    return;
  }

  DATA.employees.push({
    id: uid(),
    branchId: session.branchId,
    name, salary, post, phone,
    bankName, accNo, ifsc,
    pfPercent, pfManualAmount, ptExempt
  });

  await persist();
  closeModal();
  showToast(`"${name}" यशस्वीरित्या जोडले गेले!`, 'success');
  renderApp();
}

async function handleUpdateEmployee(e, empId) {
  e.preventDefault();
  const emp = DATA.employees.find(x => x.id === empId);
  if (!emp) return;

  const name = document.getElementById('editEmpName').value.trim();
  const salary = Number(document.getElementById('editEmpSalary').value);
  const post = document.getElementById('editEmpPost').value;
  const phone = document.getElementById('editEmpPhone').value.trim();
  const bankName = document.getElementById('editEmpBank').value.trim();
  const accNo = document.getElementById('editEmpAcc').value.trim();
  const ifsc = document.getElementById('editEmpIfsc').value.trim().toUpperCase();
  const pfPercent = Number(document.getElementById('editEmpPfPercent').value) || 0;
  const pfManualAmount = Number(document.getElementById('editEmpPfManual').value) || 0;
  const ptExempt = document.getElementById('editEmpPtExempt').checked;

  const duplicate = checkDuplicateEmployeeAcrossBranches(name, phone, accNo, empId);
  if (duplicate) {
    const exBranch = DATA.branches.find(b => b.id === duplicate.branchId);
    const bName = exBranch ? exBranch.name : 'दुसऱ्या';
    alert(`❌ त्रुटी: "${duplicate.name}" हे कर्मचारी आधीच '${bName}' शाखेत नोंदणीकृत आहेत!\nएका कर्मचाऱ्याची दोन शाखांमध्ये नोंद करता येत नाही.`);
    return;
  }

  emp.name = name;
  emp.salary = salary;
  emp.post = post;
  emp.phone = phone;
  emp.bankName = bankName;
  emp.accNo = accNo;
  emp.ifsc = ifsc;
  emp.pfPercent = pfPercent;
  emp.pfManualAmount = pfManualAmount;
  emp.ptExempt = ptExempt;

  await persist();
  closeModal();
  showToast('कर्मचारी माहिती अद्ययावत झाली!', 'success');
  renderApp();
}

async function deleteEmployee(empId) {
  const emp = DATA.employees.find(e => e.id === empId);
  if (!confirm(`तुम्हाला "${emp.name}" यांना काढून टाकायचे आहे का?`)) return;

  DATA.employees = DATA.employees.filter(e => e.id !== empId);
  Object.keys(DATA.attendance).forEach(k => {
    if (k.startsWith(empId + '|')) delete DATA.attendance[k];
  });
  DATA.advances = DATA.advances.filter(a => a.empId !== empId);

  await persist();
  showToast('कर्मचारी हटवण्यात आला.', 'success');
  renderApp();
}

function exportBranchPayrollCsv(branchId, cycleId) {
  const b = DATA.branches.find(x => x.id === branchId);
  const emps = DATA.employees.filter(e => e.branchId === branchId);
  const cycle = parseCycleId(cycleId);

  let csv = 'नाव,पद,कालावधी,एकूण दिवस,हजर (P),गैरहजर (A),हाफ डे (H),CL,रविवार (WO),देय दिवस,मूळ पगार,कमावलेला मूळ,ॲडव्हान्स कपात,PF कपात,PT कपात,अंतिम देय पगार,बँकेचे नाव,खाते क्रमांक,IFSC कोड\n';

  emps.forEach(e => {
    const s = getEmpCycleStats(e, cycle);
    csv += `"${e.name}","${e.post || ''}","${cycle.start} to ${cycle.end}",${s.totalDaysInCycle},${s.P},${s.A},${s.H},${s.CL},${s.paidWO},${s.payableDays},${e.salary},${s.earnedBasic},${s.advanceDeduction},${s.pfDeduction},${s.ptDeduction},${s.netPayable},"${e.bankName || ''}","${e.accNo || ''}","${e.ifsc || ''}"\n`;
  });

  const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${b.name}_वेतन_अहवाल_${cycle.start}_ते_${cycle.end}.csv`;
  a.click();
}

async function handleSaveAdvance(e) {
  e.preventDefault();
  const empId = document.getElementById('advEmpId').value;
  const amount = Number(document.getElementById('advAmount').value);
  const monthlyDeduction = Number(document.getElementById('advEMI').value);
  const date = document.getElementById('advDate').value;
  const note = document.getElementById('advNote').value.trim();

  DATA.advances.push({
    id: uid(),
    branchId: session.branchId,
    empId, amount, monthlyDeduction, date, note
  });

  await persist();
  closeModal();
  showToast('ॲडव्हान्स जतन झाला!', 'success');
  renderApp();
}

async function deleteAdvance(advId) {
  if (!confirm('ही ॲडव्हान्स नोंद काढून टाकायची?')) return;
  DATA.advances = DATA.advances.filter(a => a.id !== advId);
  await persist();
  showToast('ॲडव्हान्स हटवला गेला.', 'success');
  renderApp();
}

async function approveDateChangeRequest(reqId) {
  const req = DATA.dateChangeRequests.find(r => r.id === reqId);
  if (!req) return;

  req.status = 'approved';
  const key = `${req.branchId}|${req.date}`;
  if (!DATA.dateChangeApprovals) DATA.dateChangeApprovals = {};
  DATA.dateChangeApprovals[key] = {
    status: 'approved',
    approvedAt: new Date().toISOString()
  };

  await persist();
  showToast(`तारीख ${req.date} मंजूर करण्यात आली!`, 'success');
  renderApp();
}

async function rejectDateChangeRequest(reqId) {
  const req = DATA.dateChangeRequests.find(r => r.id === reqId);
  if (!req) return;
  req.status = 'rejected';
  await persist();
  showToast('विनंती नाकारण्यात आली.', 'error');
  renderApp();
}

function exportConsolidatedCsv(cycleId) {
  const cycle = parseCycleId(cycleId);
  let csv = 'शाखा,जिल्हा,कर्मचारी,पद,कालावधी,देय दिवस,मूळ पगार,कमावलेला,ॲडव्हान्स कपात,PF,PT,अंतिम देय,बँक नाव,खाते क्रमांक,IFSC कोड\n';

  DATA.branches.forEach(b => {
    DATA.employees.filter(e => e.branchId === b.id).forEach(e => {
      const s = getEmpCycleStats(e, cycle);
      csv += `"${b.name}","${b.district}","${e.name}","${e.post || ''}","${cycle.start} to ${cycle.end}",${s.payableDays},${e.salary},${s.earnedBasic},${s.advanceDeduction},${s.pfDeduction},${s.ptDeduction},${s.netPayable},"${e.bankName || ''}","${e.accNo || ''}","${e.ifsc || ''}"\n`;
    });
  });

  const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `Vedant_सर्व_शाखा_वेतन_${cycle.start}_ते_${cycle.end}.csv`;
  a.click();
}

function downloadCompleteBackup() {
  const backupObj = {
    app: 'Vedant_Attendance_System',
    version: 4,
    exportedAt: new Date().toISOString(),
    data: DATA
  };
  const str = JSON.stringify(backupObj, null, 2);
  const blob = new Blob([str], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `Vedant_Enterprises_Backup_${todayStr()}.json`;
  a.click();
}

function restoreCompleteBackup(e) {
  const file = e.target.files[0];
  if (!file) return;

  if (!confirm('सावधान! सध्याचा संपूर्ण डेटा बदलला जाईल. पुढे जायचे का?')) {
    e.target.value = '';
    return;
  }

  const reader = new FileReader();
  reader.onload = async () => {
    try {
      const parsed = JSON.parse(reader.result);
      const incoming = parsed.data || parsed;
      if (!incoming || !Array.isArray(incoming.branches)) throw new Error('अवैध फाईल');
      DATA = incoming;
      if (!DATA.advances) DATA.advances = [];
      if (!DATA.dateChangeApprovals) DATA.dateChangeApprovals = {};
      if (!DATA.dateChangeRequests) DATA.dateChangeRequests = [];
      if (!DATA.employees) DATA.employees = [];
      await persist();
      showToast('डेटा रिस्टोअर झाला!', 'success');
      renderApp();
    } catch (err) {
      alert('बॅकअप फाईल वाचता आली नाही.');
    }
  };
  reader.readAsText(file);
}

        if (isLivePush) {
          showToast(currentLang === 'mr' ? '🔄 क्लाउडवरून डेटा सिंक झाला!' : '🔄 Data synced from cloud!', 'success');
        }
        renderApp();
      }
    }, DATA);
  }
})();
</script>
