<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d9488;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background Rounded Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#grad)" filter="url(#shadow)" />
  
  <!-- Clipboard / Calendar Base -->
  <rect x="120" y="140" width="272" height="280" rx="36" fill="#ffffff" />
  <rect x="180" y="96" width="152" height="60" rx="20" fill="#0f172a" />
  <circle cx="256" cy="126" r="14" fill="#ffffff" />

  <!-- Checkmark & Details -->
  <circle cx="210" cy="230" r="22" fill="#10b981" />
  <path d="M200 230 L208 238 L222 222" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <rect x="250" y="222" width="100" height="16" rx="8" fill="#cbd5e1" />

  <circle cx="210" cy="290" r="22" fill="#10b981" />
