<html lang="mr">
<head>

<style>
/* ============================================================
   ADMIN THEME (EXECUTIVE NAVY & EMERALD)
   ============================================================ */
:root {
  --primary: #0f172a;
  --primary-accent: #1e40af;
  --teal: #0d9488;
  --teal-light: #14b8a6;
  --ink: #0f172a;
  --ink-muted: #475569;
  --bg-page: #f8fafc;
  --card-bg: #ffffff;
  --border: #e2e8f0;

  --c-present: #10b981;
  --c-absent: #ef4444;
  --c-half: #f59e0b;
  --c-cl: #3b82f6;
  --c-wo: #8b5cf6;

  --sidebar-w: 270px;
  --radius: 12px;
  --radius-sm: 8px;
  --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.08);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', 'Noto Sans Devanagari', sans-serif;
  background: var(--bg-page);
  color: var(--ink);
  line-height: 1.5;
}

button, input, select, textarea { font-family: inherit; font-size: 0.95rem; }

.app-container { display: flex; min-height: 100vh; }

.sidebar {
  width: var(--sidebar-w);
  background: linear-gradient(180deg, #090d16 0%, #172554 100%);
  color: #f1f5f9;
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 0;
  height: 100vh;
  padding: 20px 14px;
  flex-shrink: 0;
  z-index: 50;
  transition: transform 0.25s ease;
}

.brand-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 6px 10px 18px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.12);
  margin-bottom: 16px;
}

.brand-badge {
  width: 44px;
  height: 44px;
  border-radius: 12px;
  background: linear-gradient(135deg, #0d9488, #1e40af);
  color: #ffffff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 1.25rem;
  box-shadow: 0 4px 14px rgba(13, 148, 136, 0.35);
}

.user-badge {
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: var(--radius);
  padding: 10px 12px;
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 18px;
}

.user-avatar {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--teal);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
}

.nav-group {
  display: flex;
  flex-direction: column;
  gap: 4px;
  flex: 1;
  overflow-y: auto;
}

.nav-link {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 14px;
  color: #cbd5e1;
  border-radius: var(--radius-sm);
  background: transparent;
  border: none;
  width: 100%;
  text-align: left;
  cursor: pointer;
  font-size: 0.9rem;
  font-weight: 600;
  transition: all 0.15s;
}

.nav-link:hover { background: rgba(255, 255, 255, 0.08); color: #ffffff; }
.nav-link.active {
  background: linear-gradient(90deg, #1e40af, #2563eb);
  color: #ffffff;
  box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
}

.nav-badge-count {
  margin-left: auto;
  font-size: 0.72rem;
  background: #ef4444;
  color: #ffffff;
  padding: 2px 8px;
  border-radius: 12px;
  font-weight: 800;
}

.sidebar-footer {
  border-top: 1px solid rgba(255, 255, 255, 0.12);
  padding-top: 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.pwa-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 9px 12px;
  border-radius: var(--radius-sm);
  background: linear-gradient(135deg, #0d9488, #059669);
  color: #ffffff;
  border: none;
  font-size: 0.82rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.15s;
}
.pwa-btn:hover { transform: translateY(-1px); }

.logout-btn {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  background: rgba(239, 68, 68, 0.15);
  color: #fca5a5;
  border: 1px solid rgba(239, 68, 68, 0.25);
  width: 100%;
  cursor: pointer;
  font-size: 0.88rem;
  font-weight: 600;
}

.main-wrapper { flex: 1; display: flex; flex-direction: column; min-width: 0; }

.topbar {
  background: #ffffff;
  border-bottom: 1px solid var(--border);
  padding: 14px 28px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  position: sticky;
  top: 0;
  z-index: 40;
}

.topbar-title h1 {
  font-size: 1.35rem;
  font-weight: 800;
  color: var(--ink);
}

.topbar-actions { display: flex; align-items: center; gap: 12px; }

.lang-switch {
  display: flex;
  background: var(--bg-page);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 2px;
}

.lang-btn {
  border: none;
  background: transparent;
  padding: 5px 12px;
  font-size: 0.8rem;
  font-weight: 700;
  border-radius: 16px;
  cursor: pointer;
  color: var(--ink-muted);
}
.lang-btn.active {
  background: #1e40af;
  color: white;
}

.today-chip {
  background: #eff6ff;
  color: #1e40af;
  border: 1px solid #bfdbfe;
  font-size: 0.82rem;
  font-weight: 700;
  padding: 6px 14px;
  border-radius: 20px;
}

.content-body {
  padding: 24px 28px 60px;
  max-width: 1440px;
  width: 100%;
  margin: 0 auto;
}

.kpi-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 16px;
  margin-bottom: 24px;
}

.kpi-card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px 20px;
  box-shadow: var(--shadow);
  display: flex;
  align-items: center;
  gap: 16px;
}

.kpi-icon {
  width: 48px;
  height: 48px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.4rem;
  flex-shrink: 0;
}
.kpi-icon.blue { background: #dbeafe; color: #1d4ed8; }
.kpi-icon.green { background: #d1fae5; color: #047857; }
.kpi-icon.amber { background: #fef3c7; color: #b45309; }
.kpi-icon.purple { background: #ede9fe; color: #6d28d9; }

.kpi-val { font-size: 1.45rem; font-weight: 800; color: var(--ink); line-height: 1.2; }
.kpi-label { font-size: 0.8rem; font-weight: 600; color: var(--ink-muted); margin-top: 2px; }

.panel-card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 22px 24px;
  box-shadow: var(--shadow);
  margin-bottom: 24px;
}

.panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 14px;
  margin-bottom: 18px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--border);
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 8px 16px;
  border-radius: var(--radius-sm);
  font-weight: 600;
  font-size: 0.88rem;
  cursor: pointer;
  transition: all 0.15s;
  border: 1px solid transparent;
  text-decoration: none;
}
.btn-primary { background: #1e40af; color: #ffffff; }
.btn-primary:hover { background: #1e3a8a; }
.btn-outline { background: #ffffff; border-color: var(--border); color: var(--ink); }
.btn-outline:hover { background: #f1f5f9; }
.btn-success { background: #10b981; color: white; }
.btn-danger { background: #fee2e2; color: #b91c1c; border-color: #fca5a5; }
.btn-sm { padding: 5px 10px; font-size: 0.8rem; }

.table-responsive {
  overflow-x: auto;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: #ffffff;
}

table.data-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.88rem;
  text-align: left;
}
table.data-table th {
  background: #f1f5f9;
  color: var(--ink-muted);
  font-weight: 700;
  font-size: 0.78rem;
  text-transform: uppercase;
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
table.data-table td {
  padding: 11px 12px;
  border-bottom: 1px solid var(--border);
  color: var(--ink);
  vertical-align: middle;
}
table.data-table td.num { text-align: right; font-variant-numeric: tabular-nums; }

.badge { display: inline-flex; padding: 3px 8px; border-radius: 6px; font-size: 0.74rem; font-weight: 700; }
.badge-P { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
.badge-A { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
.badge-H { background: #fffbeb; color: #92400e; border: 1px solid #fde68a; }
.badge-CL { background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; }
.badge-WO { background: #f5f3ff; color: #5b21b6; border: 1px solid #ddd6fe; }
.badge-gray { background: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; }

.form-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 14px;
  margin-bottom: 16px;
}
.form-field { display: flex; flex-direction: column; gap: 5px; }
.form-field label { font-size: 0.8rem; font-weight: 600; color: var(--ink-muted); }
.form-field input, .form-field select, .form-field textarea {
  padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm);
}

/* LOGIN SCREEN */
.login-page {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: linear-gradient(135deg, #090d16 0%, #1e3a8a 100%);
  position: relative;
}

.login-card {
  background: #ffffff;
  border-radius: 16px;
  padding: 36px 32px;
  width: 100%;
  max-width: 440px;
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
  position: relative;
}

.login-top-lang { position: absolute; top: 18px; right: 20px; }
.login-brand-head { text-align: center; margin: 12px 0 24px; }
.login-logo {
  width: 58px; height: 58px; border-radius: 16px;
  background: linear-gradient(135deg, #0d9488, #1e40af);
  color: white; display: flex; align-items: center; justify-content: center;
  font-size: 1.6rem; font-weight: 800; margin: 0 auto 12px;
  box-shadow: 0 6px 18px rgba(13, 148, 136, 0.35);
}

/* MODALS */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6);
  backdrop-filter: blur(2px); display: none; align-items: center; justify-content: center;
  padding: 16px; z-index: 1000;
}
.modal-overlay.active { display: flex; }
.modal-dialog {
  background: #ffffff; border-radius: 16px; width: 100%; max-width: 600px;
  max-height: 90vh; overflow-y: auto; padding: 24px; position: relative;
}
.modal-close-btn {
  position: absolute; top: 16px; right: 18px; background: none; border: none; font-size: 1.4rem; cursor: pointer;
}

/* TOAST */
#toastContainer {
  position: fixed; bottom: 24px; right: 24px; z-index: 9999; display: flex; flex-direction: column; gap: 10px;
}
.toast-msg {
  background: #1e293b; color: #ffffff; padding: 12px 18px; border-radius: var(--radius-sm);
  font-size: 0.88rem; font-weight: 500; display: flex; align-items: center; gap: 10px;
  border-left: 4px solid var(--teal);
}

@media print {
  .sidebar, .topbar, .panel-toolbar, .no-print { display: none !important; }
  .content-body { padding: 0 !important; }
}

/* REAL-TIME SYNC BADGE */
.sync-status-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 12px;
  border-radius: 20px;
  font-size: 0.78rem;
  font-weight: 700;
  cursor: pointer;
  user-select: none;
  border: 1px solid transparent;
  transition: all 0.2s ease;
  white-space: nowrap;
}
.sync-status-pill.sync-online {
  background: #ecfdf5;
  color: #065f46;
  border-color: #a7f3d0;
}
.sync-status-pill.sync-working {
  background: #eff6ff;
  color: #1e40af;
  border-color: #bfdbfe;
  animation: pulseSync 1.4s infinite;
}
.sync-status-pill.sync-offline {
  background: #f1f5f9;
  color: #475569;
  border-color: #cbd5e1;
}
.sync-status-pill.sync-connecting {
  background: #fffbeb;
  color: #92400e;
  border-color: #fde68a;
}
@keyframes pulseSync { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }

/* MOBILE BOTTOM NAVIGATION */
.mobile-bottom-nav {
  display: none;
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 62px;
  background: #090d16;
  border-top: 1px solid rgba(255, 255, 255, 0.12);
  box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.2);
  z-index: 85;

}
.bottom-nav-item {

  flex-direction: column;
  align-items: center;
  justify-content: center;
  flex: 1;
  height: 100%;
  background: transparent;
  border: none;
  color: #94a3b8;
  font-size: 0.68rem;
  font-weight: 600;
  cursor: pointer;

  padding: 4px 0;

}
.bottom-nav-item.active {

}
.bottom-nav-item .nav-icon {

}
.bottom-badge {

/* SIDEBAR BACKDROP */
.sidebar-backdrop {

.sidebar-backdrop.active {

.mobile-toggle {

/* RESPONSIVE FOR MOBILE PHONES */

  body {

  }

@media (max-width: 640px) {
  .topbar-title h1 {
    max-width: 120px;
    font-size: 0.92rem;
  }
  .kpi-grid {
    grid-template-columns: 1fr 1fr !important;
  }
  .form-grid {
    grid-template-columns: 1fr !important;
  }
  .modal-dialog {
    width: 95% !important;
    max-height: 88vh;
    padding: 16px 14px;
    margin: 10px auto;
  }
  .login-card {
    padding: 24px 18px;
  }
  .data-table th, .data-table td {
    padding: 8px 8px;
    font-size: 0.82rem;
  }
}
</style>

<script>
/* ============================================================
   VEDANT ENTERPRISES CENTRAL ADMIN PORTAL
   ============================================================ */

const APP_STORAGE_KEY = 'vedant_attendance_data_v3';
const APP_ADMIN_REMEMBER_KEY = 'vedant_remembered_admin_v3';

const MONTHS_MR = ['जानेवारी','फेब्रुवारी','मार्च','एप्रिल','मे','जून','जुलै','ऑगस्ट','सप्टेंबर','ऑक्टोबर','नोव्हेंबर','डिसेंबर'];
const MONTHS_EN = ['January','February','March','April','May','June','July','August','September','October','November','December'];

const MASTER_ADMIN_DEFAULT_PASS = 'admin123';

function getDatesInCycle(startDateStr, endDateStr) {
  const dates = [];
  let cur = new Date(startDateStr + 'T00:00:00');
  const end = new Date(endDateStr + 'T00:00:00');
  while (cur <= end) {
    const y = cur.getFullYear();
    const m = String(cur.getMonth() + 1).padStart(2, '0');
    const d = String(cur.getDate()).padStart(2, '0');
    dates.push(`${y}-${m}-${d}`);
    cur.setDate(cur.getDate() + 1);
  }
  return dates;
}

function getAvailableCycles() {
  const list = [];
  const now = new Date();
  const baseYear = now.getFullYear();

  for (let offset = -4; offset <= 4; offset++) {
    const sDate = new Date(baseYear, now.getMonth() + offset, 20);
    const eDate = new Date(baseYear, now.getMonth() + offset + 1, 19);

    const sY = sDate.getFullYear();
    const sM = String(sDate.getMonth() + 1).padStart(2, '0');
    const eY = eDate.getFullYear();
    const eM = String(eDate.getMonth() + 1).padStart(2, '0');

    const startStr = `${sY}-${sM}-20`;
    const endStr = `${eY}-${eM}-19`;

    list.push({
      id: `${startStr}|${endStr}`,
      start: startStr,
      end: endStr,
      label: currentLang === 'mr'
        ? `20 ${MONTHS_MR[sDate.getMonth()]} ते 19 ${MONTHS_MR[eDate.getMonth()]} ${eY}`
        : `20 ${MONTHS_EN[sDate.getMonth()]} to 19 ${MONTHS_EN[eDate.getMonth()]} ${eY}`
    });
  }
  return list;
}

function getDefaultCycleId() {
  const now = new Date();
  const day = now.getDate();
  const m = now.getMonth();
  const y = now.getFullYear();

  let sDate, eDate;
  if (day >= 20) {
    sDate = new Date(y, m, 20);
    eDate = new Date(y, m + 1, 19);
  } else {
    sDate = new Date(y, m - 1, 20);
    eDate = new Date(y, m, 19);
  }

  const sY = sDate.getFullYear();
  const sM = String(sDate.getMonth() + 1).padStart(2, '0');
  const eY = eDate.getFullYear();
  const eM = String(eDate.getMonth() + 1).padStart(2, '0');

  return `${sY}-${sM}-20|${eY}-${eM}-19`;
}

function parseCycleId(cycleId) {
  if (!cycleId || !cycleId.includes('|')) cycleId = getDefaultCycleId();
  const [start, end] = cycleId.split('|');
  const [sY, sM] = start.split('-').map(Number);
  const [eY, eM] = end.split('-').map(Number);

  return {
    id: cycleId,
    start,
    end,
    label: currentLang === 'mr'

function calculateMaharashtraPT(salary, ym, isExempt) {
  if (isExempt) return 0;
  const sal = Number(salary) || 0;
  if (sal <= 7500) return 0;
  if (sal <= 10000) return 175;
  const month = Number(ym.split('-')[1]);
  return month === 2 ? 300 : 200;
}

function deductionForCycle(adv, cycle) {
  const monthly = Number(adv.monthlyDeduction) || Number(adv.amount);
  if (adv.date > cycle.end) return 0;
  const advMonthIdx = (new Date(adv.date).getFullYear() * 12) + new Date(adv.date).getMonth();
  const cycleMonthIdx = (new Date(cycle.start).getFullYear() * 12) + new Date(cycle.start).getMonth();
  const elapsed = cycleMonthIdx - advMonthIdx;
  if (elapsed < 0) return 0;
  const deductedBefore = elapsed * monthly;
  const remainingBefore = Number(adv.amount) - deductedBefore;
  if (remainingBefore <= 0) return 0;
  return Math.min(monthly, remainingBefore);
}

function advanceRemainingForCycle(adv, cycle) {
  const monthly = Number(adv.monthlyDeduction) || Number(adv.amount);
  const advMonthIdx = (new Date(adv.date).getFullYear() * 12) + new Date(adv.date).getMonth();
  const cycleMonthIdx = (new Date(cycle.start).getFullYear() * 12) + new Date(cycle.start).getMonth();
  const elapsed = cycleMonthIdx - advMonthIdx + 1;
  if (elapsed <= 0) return Number(adv.amount);
  const deducted = Math.min(Number(adv.amount), elapsed * monthly);
  return Math.max(0, Number(adv.amount) - deducted);
}

function getEmpCycleStats(emp, cycle) {
  const dates = cycle.dates;
  const totalDaysInCycle = dates.length;
  let P = 0, A = 0, H = 0, CL = 0, WO = 0, HL = 0, NM = 0;

  dates.forEach(dStr => {
    const st = DATA.attendance[attnKey(emp.id, dStr)];
    if (st === 'P') P++;
    else if (st === 'A') A++;
    else if (st === 'H') H++;
    else if (st === 'CL') CL++;
    else if (st === 'WO') WO++;
    else if (st === 'HL') HL++;
    else NM++;
  });

  const clAllowed = DATA.settings.clAllowedPerMonth ?? 1;
  const paidCL = Math.min(CL, clAllowed);
  const paidWO = DATA.settings.paidWeeklyOff ? WO : 0;
  const payableDays = P + (H * 0.5) + paidCL + paidWO;

  const perDaySalary = (Number(emp.salary) || 0) / totalDaysInCycle;
  const earnedBasic = Math.round(perDaySalary * payableDays);

  const empAdvs = DATA.advances.filter(a => a.empId === emp.id);
  const advanceDeduction = empAdvs.reduce((s, a) => s + deductionForCycle(a, cycle), 0);

  let pfDeduction = 0;
  const pfPercent = Number(emp.pfPercent) || 0;
  const pfManual = Number(emp.pfManualAmount) || 0;
  if (pfPercent > 0 && earnedBasic > 0) pfDeduction = Math.round(earnedBasic * (pfPercent / 100));
  else if (pfManual > 0 && earnedBasic > 0) pfDeduction = Math.round(pfManual);

  let ptDeduction = 0;
  if (DATA.settings.ptEnabled && earnedBasic > 0) {
    ptDeduction = calculateMaharashtraPT(emp.salary, cycle.end.slice(0, 7), emp.ptExempt);
  }

  const totalDeductions = advanceDeduction + pfDeduction + ptDeduction;
  const netPayable = Math.max(0, earnedBasic - totalDeductions);
  const attPercent = totalDaysInCycle > 0 ? Math.round((payableDays / totalDaysInCycle) * 100) : 0;

  return { totalDaysInCycle, P, A, H, CL, WO, HL, payableDays, earnedBasic, advanceDeduction, pfDeduction, ptDeduction, netPayable, attPercent };
}

function renderOverview(cycle) {

async function approveReq(id) {
  const req = DATA.dateChangeRequests.find(r => r.id === id);
  if (!req) return;
  req.status = 'approved';
  DATA.dateChangeApprovals[`${req.branchId}|${req.date}`] = { status: 'approved', approvedAt: new Date().toISOString() };
  await persist();
  showToast('मंजूर करण्यात आले!', 'success');
  renderApp();
}

async function rejectReq(id) {
  const req = DATA.dateChangeRequests.find(r => r.id === id);
  if (!req) return;
  req.status = 'rejected';
  await persist();
  showToast('नाकारण्यात आले.', 'error');
  renderApp();
}

          <h2>${isMr ? 'संपूर्ण डेटा बॅकअप (JSON)' : 'Full System Backup (JSON)'}</h2>
        </div>
      </div>
      <div style="display:flex;gap:14px;flex-wrap:wrap;">
        <button class="btn btn-outline" onclick="downloadBackup()">💾 ${isMr ? 'बॅकअप डाऊनलोड करा' : 'Download Backup'}</button>
        <label class="btn btn-primary" style="cursor:pointer;margin:0;">
          📥 ${isMr ? 'बॅकअप अपलोड करा' : 'Restore Backup'}
          <input type="file" accept="application/json" onchange="restoreBackup(event)" style="display:none;">
        </label>
      </div>
    </div>
  `;
}

async function handleSaveSettings(e) {
  e.preventDefault();
  DATA.settings.clAllowedPerMonth = Number(document.getElementById('setCl').value) || 0;
  DATA.mainAdminPassword = document.getElementById('setMasterPass').value.trim() || MASTER_ADMIN_DEFAULT_PASS;
  await persist();
  showToast('सेटिंग्ज जतन झाल्या!', 'success');
  renderApp();
}

function downloadBackup() {
  const blob = new Blob([JSON.stringify(DATA, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `Vedant_Backup_${todayStr()}.json`;
  a.click();
}

function restoreBackup(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    try {
      const d = JSON.parse(reader.result);
      if (!d.branches) throw new Error();
      DATA = d;
      await persist();
      showToast('डेटा रिस्टोअर झाला!', 'success');
      renderApp();
    } catch(err) {
      alert('अवैध बॅकअप फाईल');
    }
  };
  reader.readAsText(file);
}

/* ---------------- PWA INSTALLATION TRIGGER ---------------- */
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  checkPwaInstallable();
});

function checkPwaInstallable() {
  const btn = document.getElementById('pwaInstallBtn');
  if (btn && deferredPrompt) {
    btn.style.display = 'flex';
  }
}

function triggerPwaInstall() {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then((choiceResult) => {
      if (choiceResult.outcome === 'accepted') {
        showToast('ऍप इन्स्टॉल केले जात आहे!', 'success');
      }
      deferredPrompt = null;
      checkPwaInstallable();
    });
  }
}

// Register Service Worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}

/* ---------------- INITIALIZER ---------------- */
(function initAdmin() {
  loadLocalData();
  if (localStorage.getItem(APP_ADMIN_REMEMBER_KEY) === 'true') {
    isAdminLoggedIn = true;
  }
  renderApp();

  // Initialize Real-Time Multi-Device Sync for Central Admin
  if (typeof SyncEngine !== 'undefined') {
    SyncEngine.init((remoteData, isLivePush) => {
      if (remoteData && Array.isArray(remoteData.branches)) {
        DATA = remoteData;
        saveDataLocal();
        if (isLivePush) {
          showToast(currentLang === 'mr' ? '🔄 शाखेकडून नवीन अपडेट आले!' : '🔄 Live update received from branch!', 'success');
        }
        renderApp();
      }
    });
  }
})();
</script>
